/* =====================================================
   SETUP

   所有 Canvas 最小颗粒 = 2 × 2
===================================================== */

const canvas =
  document.getElementById("scene");

const ctx =
  canvas.getContext("2d");

  false;


const W =
  320;

const H =
  180;

const PX =
  2;


/* =====================================================
   CANVAS SCALE
===================================================== */

function fitCanvas() {

  const scale =
    Math.max(
      window.innerWidth / W,
      window.innerHeight / H
    );

  canvas.style.width =
    Math.ceil(
      W * scale
    ) + "px";

  canvas.style.height =
    Math.ceil(
      H * scale
    ) + "px";
}


window.addEventListener(
  "resize",
  fitCanvas
);


fitCanvas();

===================================================== */

/* =====================================================
   BASIC PIXEL
===================================================== */

function px(
  x,
  y,
  color,
  alpha = 1
) {

  ctx.globalAlpha =
    alpha;

  ctx.fillStyle =
    color;

  ctx.fillRect(

    Math.round(
      x / PX
    ) * PX,

    Math.round(
      y / PX
    ) * PX,

    PX,
    PX

  );

  ctx.globalAlpha =
    1;
}


/* =====================================================
   LARGE SHAPE MADE OF 2×2
===================================================== */

function rect2(
  x,
  y,
  width,
  height,
  color,
  alpha = 1
) {

  for (
    let yy = y;
    yy < y + height;
    yy += PX
  ) {

    for (
      let xx = x;
      xx < x + width;
      xx += PX
    ) {

      px(
        xx,
        yy,
        color,
        alpha
      );

    }

  }
}


/* =====================================================
   RGB MIX
===================================================== */

function mix(
  a,
  b,
  t
) {

  const r =
    Math.round(
      a[0] +
      (
        b[0] -
        a[0]
      ) *
      t
    );

  const g =
    Math.round(
      a[1] +
      (
        b[1] -
        a[1]
      ) *
      t
    );

  const blue =
    Math.round(
      a[2] +
      (
        b[2] -
        a[2]
      ) *
      t
    );

  return (
    "rgb(" +
    r +
    "," +
    g +
    "," +
    blue +
    ")"
  );
}


/* =====================================================
   SKY
===================================================== */

const horizon =
  136;


function skyColor(y) {

  const t =
    y /
    horizon;


  if (
    t <
    0.18
  ) {

    return mix(
      C.sky0,
      C.sky1,
      t / 0.18
    );

  }


  if (
    t <
    0.38
  ) {

    return mix(
      C.sky1,
      C.sky2,
      (
        t -
        0.18
      )
      /
      0.20
    );

  }


  if (
    t <
    0.60
  ) {

    return mix(
      C.sky2,
      C.sky3,
      (
        t -
        0.38
      )
      /
      0.22
    );

  }


  if (
    t <
    0.80
  ) {

    return mix(
      C.sky3,
      C.sky4,
      (
        t -
        0.60
      )
      /
      0.20
    );

  }


  if (
    t <
    0.93
  ) {

    return mix(
      C.sky4,
      C.sky5,
      (
        t -
        0.80
      )
      /
      0.13
    );

  }


  return mix(
    C.sky5,
    C.sky6,
    (
      t -
      0.93
    )
    /
    0.07
  );
}


function drawSky() {

  for (
    let y = 0;
    y < horizon;
    y += PX
  ) {

    const color =
      skyColor(y);


    for (
      let x = 0;
      x < W;
      x += PX
    ) {

      px(
        x,
        y,
        color
      );

    }

  }
}

function drawCloudMass(
  baseX,
  baseY,
  pieces
) {

  pieces.forEach(
    (
      [
        x,
        y,
        width,
        height,
        color
      ]
    ) => {

      rect2(

        baseX + x,

        baseY + y,

        width,

        height,

        color

  );
}


function drawClouds(state) {

  clouds.forEach(
    cloud => {

      const wrap =
        W + 220;


      let x =
        cloud.x +
        state.cloudShift *
        cloud.speed;


      while (
        x >
        W + 100
      ) {

        x -=
          wrap;

      }


      drawCloudMass(
        x,
        cloud.y,
        cloud.pieces
      );


      drawCloudMass(
        x - wrap,
        cloud.y,
        cloud.pieces
      );

    }
  );
}


/* =====================================================
   MOON
===================================================== */

const moonX =
  228;

const moonY =
  116;


/*
  像素圆
*/

const moonPattern = [

  "000000111111111000000",

  "000011111111111110000",

  "000111111111111111000",

  "001111111111111111100",

  "011111111111111111110",

  "011111111111111111110",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "011111111111111111110",

  "011111111111111111110",

  "001111111111111111100",

  "000111111111111111000",

  "000011111111111110000",

  "000000111111111000000"

];


/* =====================================================
   PIXEL SELF-GLOW

   不是一圈。
   从月亮向外逐渐衰减。
===================================================== */

function drawMoonGlow() {

  const maxRadius =
    34;

  const moonRadius =
    18;


  for (
    let y = -maxRadius;
    y <= maxRadius;
    y += PX
  ) {

    for (
      let x = -maxRadius;
      x <= maxRadius;
      x += PX
    ) {

      const d =
        Math.sqrt(
          x * x +
          y * y
        );


      if (
        d >
        moonRadius &&
        d <
        maxRadius
      ) {

        const normalized =
          1 -
          (
            d -
            moonRadius
          )
          /
          (
            maxRadius -
            moonRadius
          );


        const alpha =
          normalized *
          normalized *
          0.12;


        px(
          moonX + x,
          moonY + y,
          "#fff1ba",
          alpha
        );

      }

    }

  }
}


function moonShade(
  row,
  column
) {

  /*
    轻微斜向明暗
  */

  const level =
    row +
    column *
    0.5;


  if (
    level <
    7
  ) {

    return C.moonDark;

  }


  if (
    level <
    12
  ) {

    return C.moonEdge;

  }


  if (
    level <
    17
  ) {

    return C.moonMid;

  }


  if (
    level <
    22
  ) {

    return C.moonLight;

  }


  return C.moonCore;
}


function drawMoon() {

  /*
    先画发光
  */

  drawMoonGlow();


  const startX =
    moonX - 20;

  const startY =
    moonY - 18;


  moonPattern.forEach(
    (
      row,
      rowIndex
    ) => {

      [...row].forEach(
        (
          value,
          columnIndex
        ) => {

          if (
            value ===
            "1"
          ) {

            px(

              startX +
              columnIndex *
              PX,

              startY +
              rowIndex *
              PX,

              moonShade(
                rowIndex,
                columnIndex
              )

            );

          }

        }
      );

    }
  );
}


/* =====================================================
   HORIZON
===================================================== */

function drawHorizon() {

    0,
    horizon,
    W,
    2,
    "#071923"

}


/* =====================================================
   WATER
===================================================== */

function waterColor(y) {

  const t =
    (
      y -
      horizon
    )
    /
    (
      H -
      horizon
    );


  if (
    t <
    0.35
  ) {

    return mix(
      C.water0,
      C.water1,
      t / 0.35
    );

  }


  if (
    t <
    0.70
  ) {

    return mix(
      C.water1,
      C.water2,
      (
        t -
        0.35
      )
      /
      0.35
    );

  }


  return mix(
    C.water2,
    C.water3,
    (
      t -
      0.70
    )
    /
    0.30
  );
}


function drawWaterBase() {

  for (
    let y =
      horizon + 2;
    y < H;
    y += PX
  ) {

    const color =
      waterColor(y);


    for (
      let x = 0;
      x < W;
      x += PX
    ) {

      px(
        x,
        y,
        color
      );

    }

  }
}


/* =====================================================
   FULL WAVE
===================================================== */

function fullWave(
  baseY,
  amplitude,
  wavelength,
  shift,
  color
) {

  let previousY =
    baseY;


  for (
    let x = 0;
    x < W;
    x += PX
  ) {

    const rawY =
      baseY +
      Math.sin(
        (
          x -
          shift
        )
        /
        wavelength
      ) *
      amplitude;


    const y =
      Math.round(
        rawY /
        PX
      ) *
      PX;


    px(
      x,
      y,
      color
    );


    if (
      y !==
      previousY
    ) {

      px(
        x,
        Math.min(
          y,
          previousY
        ),
        color
      );

    }


    previousY =
      y;

  }
}

===================================================== */

const sparkleData = [

  [250,149,23.0],

  [311,156,25.0]

];


function drawSparkles(
  state
) {

  sparkleData.forEach(
    (
      [
        baseX,
        baseY,
        phase
      ],
      index
    ) => {

      /*
        出现窗口很窄
      */

      const light =
        0.5 +
        0.5 *
        Math.sin(
          state.time *
          0.00115 +
          phase
        );


      if (
        light >
        0.93
      ) {

        const driftX =
          Math.round(
            Math.sin(
              state.time *
              0.00037 +
              phase
            ) *
            2 /
            PX
          ) *
          PX;


        const driftY =
          Math.round(
            Math.sin(
              state.time *
              0.00049 +
              phase *
              1.3
            ) *
            1 /
            PX
          ) *
          PX;


        const color =
          light >
          0.975
          ?
          C.sparkle1
          :
          C.sparkle0;


        /*
          大部分是一个 2×2 点
        */

        px(
          baseX +
          driftX,
          baseY +
          driftY,
          color
        );


        /*
          极少数会短暂形成两个像素
        */

        if (
          index % 5 === 0 &&
          light > 0.98
        ) {

          px(
            baseX +
            driftX +
            2,
            baseY +
            driftY,
            color
          );

        }

      }

    }
  );
}


/* =====================================================
   RIVER
===================================================== */

function drawRiver(
  state
) {

  fullWave(
    144,
    1.1,
    40,
    state.flow * 18,
    C.wave0
  );


  fullWave(
    154,
    1.2,
    54,
    state.flow * 16 + 18,
    C.wave1
  );


  fullWave(
    165,
    1.4,
    66,
    state.flow * 20 + 36,
    C.wave1
  );


  fullWave(
    176,
    1.2,
    76,
    state.flow * 15 + 12,
    C.wave2
  );


  /*
    月光倒影
  */

  const shimmer =
    Math.round(
      Math.sin(
        state.time *
        0.0009
      ) *
      2 /
      PX
    ) *
    PX;


  rect2(
    moonX - 8 + shimmer,
    140,
    16,
    2,
    C.reflection2
  );


  rect2(
    moonX - 4 - shimmer,
    148,
    8,
    2,
    C.reflection0
  );


  rect2(
    moonX - 10 + shimmer,
    158,
    20,
    2,
    C.reflection1
  );


  rect2(
    moonX - 6,
    168,
    12,
    2,
    C.reflection0
  );


  rect2(
    moonX - 8 - shimmer,
    178,
    16,
    2,
    C.reflection1
  );


  drawSparkles(
    state
  );
}

  {

    length: 94,
    phase: 3.8,
    density: 0.43,
    curve: 0.88
  },


  {
    root: 314,
    length: 145,
    phase: 4.5,
    density: 0.68,
    curve: 1.30
  }

];


/* =====================================================
   CREATE 4-PART PHYSICS
===================================================== */

const willowPhysics =
  willowConfigs.map(
    config => {

      return {

        config: config,

        angle: [
          0,
          0,
          0,
          0
        ],

        velocity: [
          0,
          0,
          0,
          0
        ]

      };

    }
  );


/*
  每个物理段：
  1 → 最稳
  4 → 最柔
*/

const segmentSpring = [
  12.0,
  10.0,
  8.0,
  6.0
];


const segmentDamping = [
  8.5,
  7.7,
  7.0,
  6.2
];


/* =====================================================
   UPDATE WILLOW PHYSICS

   风始终 LEFT → RIGHT
===================================================== */

function updateWillowPhysics(
  state,
  dt
) {

  willowPhysics.forEach(
    (
      branch,
      branchIndex
    ) => {

      const config =
        branch.config;


      /*
        永久存在的向右风
      */

      const baseWind =
        0.075;


      /*
        很慢的阵风变化
        只改变强度，不改变方向
      */

      const gust =
        0.018 +
        Math.sin(
          state.time *
          0.00023 +
          config.phase
        ) *
        0.012 +
        Math.sin(
          state.time *
          0.00041 +
          config.phase *
          1.7
        ) *
        0.006;


      const wind =
        Math.max(
          0.045,
          baseWind +
          gust
        );


      /*
        四段拥有完全独立目标角度
      */

      const targets = [

        0.025 +
        wind *
        0.55 *
        config.curve +
        Math.sin(
          state.time *
          0.00028 +
          config.phase
        ) *
        0.004,


        0.040 +
        wind *
        0.82 *
        config.curve +
        Math.sin(
          state.time *
          0.00036 +
          config.phase +
          0.6
        ) *
        0.008,


        0.058 +
        wind *
        1.12 *
        config.curve +
        Math.sin(
          state.time *
          0.00045 +
          config.phase +
          1.2
        ) *
        0.013,


        0.078 +
        wind *
        1.42 *
        config.curve +
        Math.sin(
          state.time *
          0.00056 +
          config.phase +
          1.9
        ) *
        0.019

      ];


      /*
        每段独立 Spring-Damper
      */

      for (
        let segment = 0;
        segment < 4;
        segment++
      ) {

        const angle =
          branch.angle[
            segment
          ];


        const velocity =
          branch.velocity[
            segment
          ];


        const acceleration =
          (
            targets[
              segment
            ] -
            angle
          ) *
          segmentSpring[
            segment
          ];


        let newVelocity =
          velocity +
          acceleration *
          dt;


        /*
          连续阻尼
        */

        newVelocity *=
          Math.exp(
            -
            segmentDamping[
              segment
            ] *
            dt
          );


        branch.velocity[
          segment
        ] =
          newVelocity;


        branch.angle[
          segment
        ] +=
          newVelocity *
          dt;

      }

    }
  );
}


/* =====================================================
   STEM LINE
===================================================== */

function stemLine(
  x0,
  y0,
  x1,
  y1,
  color
) {

  const dx =
    x1 -
    x0;

  const dy =
    y1 -
    y0;


  const distance =
    Math.max(
      Math.abs(dx),
      Math.abs(dy)
    );


  const steps =
    Math.max(
      1,
      Math.ceil(
        distance /
        PX
      )
    );


  for (
    let i = 0;
    i <= steps;
    i++
  ) {

    const t =
      i /
      steps;


    px(

      x0 +
      dx *
      t,

      y0 +
      dy *
      t,

      color

    );

  }
}


/* =====================================================
   DETERMINISTIC LEAF SEED
===================================================== */

function leafSeed(
  branchIndex,
  section,
  index
) {

  return (
    branchIndex *
    53 +
    section *
    31 +
    index *
    29
  )
  %
  100;
}


/* =====================================================
   DRAW 4-PART WILLOW
===================================================== */

function drawOneWillow(
  branch,
  branchIndex
) {

  const config =
    branch.config;


  /*
    四段长度不完全一样
    末段稍长
  */

  const proportions = [
    0.22,
    0.24,
    0.25,
    0.29
  ];


  let currentX =
    config.root;

  let currentY =
    -4;


  for (
    let section = 0;
    section < 4;
    section++
  ) {

    const length =
      config.length *
      proportions[
        section
      ];


    const angle =
      branch.angle[
        section
      ];


    /*
      angle = 0 表示垂直下落
      正角度 = 向右吹
    */

    const endX =
      currentX +
      Math.sin(
        angle
      ) *
      length;


    const endY =
      currentY +
      Math.cos(
        angle
      ) *
      length;


    /*
      每个物理段内部再细分，
      画面不会是僵硬折线
    */

    const visualSteps =
      Math.max(
        3,
        Math.round(
          length /
          8
        )
      );


    let lastX =
      currentX;

    let lastY =
      currentY;


    for (
      let i = 1;
      i <= visualSteps;
      i++
    ) {

      const t =
        i /
        visualSteps;


      /*
        轻微二次弧度
      */

      const bend =
        Math.sin(
          t *
          Math.PI
        ) *
        angle *
        length *
        0.10;


      const x =
        currentX +
        (
          endX -
          currentX
        ) *
        t +
        bend;


      const y =
        currentY +
        (
          endY -
          currentY
        ) *
        t;


      const gridX =
        Math.round(
          x /
          PX
        ) *
        PX;


      const gridY =
        Math.round(
          y /
          PX
        ) *
        PX;


      stemLine(
        lastX,
        lastY,
        gridX,
        gridY,
        C.willow
      );


      /*
        叶片疏密由每根柳枝自身控制
      */

      const seed =
        leafSeed(
          branchIndex,
          section,
          i
        );


      if (
        seed <
        config.density *
        100
      ) {

        if (
          seed %
          3 ===
          0
        ) {

          px(
            gridX +
            2,
            gridY,
            C.willowLight
          );


          px(
            gridX +
            4,
            gridY,
            C.willowLight
          );

        }


        else if (
          seed %
          3 ===
          1
        ) {

          px(
            gridX -
            2,
            gridY +
            2,
            C.willowDark
          );


          px(
            gridX -
            4,
            gridY +
            2,
            C.willowDark
          );

        }


        else {

          px(
            gridX +
            2,
            gridY +
            2,
            C.willowLight
          );

        }

      }


      lastX =
        gridX;

      lastY =
        gridY;

    }


    currentX =
      endX;

    currentY =
      endY;

  }
}


function drawWillows() {

  willowPhysics.forEach(
    (
      branch,
      index
    ) => {

      drawOneWillow(
        branch,
        index
      );

    }
  );
}


/* =====================================================

  ],

  ]

const CN = {

  "山": [

  ]

};


function drawMatrix(
  matrix,
  x,
  y
) {

  matrix.forEach(
    (
      row,
      rowIndex
    ) => {

      [...row].forEach(
        (
          value,
          columnIndex
        ) => {

          if (
            value ===
            "1"
          ) {

            px(

              x +
              columnIndex *
              PX,

              y +
              rowIndex *
              PX,

              C.white

            );

          }

        }
      );

    }
  );
}


/* =====================================================
   TITLE
===================================================== */

function drawTitle() {

  const english =
    [
      "h",
      "i",
      " ",
      "i",
      "'",
      "m"
    ];


  const widths = {

    h: 5,
    i: 5,
    "'": 5,
    m: 5,
    " ": 3

  };


  const letterGap =
    4;


  let englishWidth =
    0;


  english.forEach(
    char => {

      englishWidth +=
        widths[
          char
        ] *
        PX +
        letterGap;

    }
  );


  const chineseGap =
    6;


  const chineseWidth =
    3 *
    (
      9 *
      PX
    ) +
    2 *
    chineseGap;


  const totalWidth =
    englishWidth +
    10 +
    chineseWidth;


  let x =
    Math.round(
      (
        (
          W -
          totalWidth
        )
        /
        2
      )
      /
      PX
    ) *
    PX;


  const y =
    88;


  english.forEach(
    char => {

      if (
        char !==
        " "
      ) {

        drawMatrix(
          EN[
            char
          ],
          x,
          y + 2
        );

      }


      x +=
        widths[
          char
        ] *
        PX +
        letterGap;

    }
  );


  x +=
    6;


  [
    "山",
    "山",
    "田"
  ].forEach(
    (
      char,
      index
    ) => {

      drawMatrix(
        CN[
          char
        ],
        x,
        y
      );


      x +=
        9 *
        PX;


      if (
        index <
        2
      ) {

        x +=
          chineseGap;

      }

    }
  );
}


/* =====================================================
   ANIMATION STATE
===================================================== */

const state = {

  time:
    0,

  flow:
    0,

  cloudShift:
    0,

  last:
    0

};


/* =====================================================
   MAIN LOOP

   不限制 FPS。
   浏览器能 60Hz 就 60，
   120Hz 就 120。
===================================================== */

function render(
  stamp
) {

  if (
    !state.last
  ) {

    state.last =
      stamp;

  }


  let dt =
    (
      stamp -
      state.last
    )
    /
    1000;


  /*
    防止切后台后物理爆掉
  */

  dt =
    Math.min(
      dt,
      0.033
    );


  state.last =
    stamp;


  state.time =
    stamp;


  /*
    江水很慢
  */

  state.flow +=
    dt *
    1.05;


  /*
    云更慢
  */

  state.cloudShift +=
    dt *
    0.65;


  /*
    更新四段柳枝物理
  */

  updateWillowPhysics(
    state,
    dt
  );


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    BACK → FRONT
  */

  drawSky();


  drawClouds(
    state
  );


  drawMoon();


  drawHorizon();


  drawWaterBase();


  drawRiver(
    state
  );


  drawWillows();


  /*
    标题最后，
    永远保持纯白
  */

  drawTitle();


  requestAnimationFrame(
    render
  );
}


requestAnimationFrame(
  render
);
