<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>雅蘭亭拾遺</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f5f4ef;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ===============================
       TOP BAR
    =============================== */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 60px;
      padding: 0 34px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 100;

      background: rgba(2, 6, 18, 0.62);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(5px);
    }

    .site-name {
      margin: 0;

      color: white;

      font-family:
        "Songti TC",
        "STSong",
        "PingFang TC",
        serif;

      font-weight: 400;
      font-size: 17px;
      letter-spacing: 5px;
    }

    nav a {
      margin-left: 25px;

      color: rgba(255,255,255,0.72);

      text-decoration: none;

      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }

    nav a:hover {
      color: white;
    }

    /* ===============================
       HERO
    =============================== */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 650px;

      overflow: hidden;

      background: #020611;
    }

    canvas {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .scroll {
      position: absolute;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      color: rgba(255,255,255,0.25);

      font-family: monospace;
      font-size: 9px;
      letter-spacing: 4px;
    }

    /* ===============================
       BELOW
    =============================== */

    .content {
      max-width: 850px;
      margin: auto;
      padding: 90px 24px;
    }

    .content section {
      margin-bottom: 100px;
    }

    .content h2 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    .content p {
      line-height: 1.9;
      color: #444;
    }

    .blog-card {
      padding: 25px 0;
      border-bottom: 1px solid #ddd;
    }

    .blog-card a {
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      header {
        padding: 0 15px;
      }

      .site-name {
        font-size: 13px;
        letter-spacing: 2px;
      }

      nav a {
        margin-left: 10px;
        font-size: 10px;
      }
    }
  </style>
</head>


<body>


<header>

  <h1 class="site-name">
    雅蘭亭拾遺
  </h1>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#blog">Blog</a>
  </nav>

</header>



<section class="hero" id="home">

  <!--
    Very low-resolution world.
    This is what gives us the large chunky pixel look.
  -->

  <canvas
    id="scene"
    width="240"
    height="135"
  ></canvas>

  <div class="scroll">
    SCROLL ↓
  </div>

</section>



<main class="content">

  <section id="about">

    <h2>About Me</h2>

    <p>
      Hi! I'm 山山田.
    </p>

    <p>
      Welcome to my personal blog.
      This is where I keep thoughts,
      memories, experiences,
      and things I find interesting.
    </p>

  </section>


  <section id="blog">

    <h2>Blog</h2>

    <div class="blog-card">
      <h3>
        <a href="#">My First Blog Post</a>
      </h3>

      <p>August 20, 2026</p>

      <p>
        Welcome to my little corner of the internet.
      </p>
    </div>

  </section>

</main>


<footer>
  © 2026 雅蘭亭拾遺
</footer>



<script>

/* =========================================================
   SETUP
========================================================= */

const canvas =
  document.getElementById("scene");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 240;
const H = 135;


/*
  Fundamental visual unit.

  Almost all objects are aligned to this grid.
*/

const P = 2;



function fitCanvas() {

  const scale =
    Math.max(
      window.innerWidth / W,
      window.innerHeight / H
    );

  canvas.style.width =
    Math.ceil(W * scale) + "px";

  canvas.style.height =
    Math.ceil(H * scale) + "px";
}

window.addEventListener(
  "resize",
  fitCanvas
);

fitCanvas();



/* =========================================================
   PALETTE

   Dark black-blue top,
   saturated blue below.
========================================================= */

const C = {

  black:
    "#01040b",

  sky0:
    "#030817",

  sky1:
    "#07152c",

  sky2:
    "#0b2450",

  sky3:
    "#103776",

  sky4:
    "#174b9b",

  sky5:
    "#235eb9",


  cloudDark:
    "#173974",

  cloudMid:
    "#2453a4",

  cloudLight:
    "#316bd0",


  bank0:
    "#06131c",

  bank1:
    "#09202b",

  bank2:
    "#103142",


  water0:
    "#0a263b",

  water1:
    "#103850",

  water2:
    "#174962",

  water3:
    "#236079",


  wave0:
    "#2c6c87",

  wave1:
    "#3c829b",

  wave2:
    "#5a9daf",


  willow0:
    "#0a3a31",

  willow1:
    "#0f5545",

  willow2:
    "#17705a",


  moonGlow:
    "#7b7357",

  moonEdge:
    "#d8c58c",

  moon:
    "#fff1bd",

  moonCore:
    "#fffbe4",


  shine:
    "#ffeab3",

  shine2:
    "#d7c891",

  white:
    "#ffffff"
};



/* =========================================================
   BASIC BLOCK
========================================================= */

function block(
  x,
  y,
  w,
  h,
  color
) {

  ctx.fillStyle = color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );

}



/* =========================================================
   SKY

   Large chunky fields only.
========================================================= */

function drawSky() {

  /*
    Top absolutely dark.
  */

  block(
    0,
    0,
    W,
    16,
    C.black
  );


  block(
    0,
    16,
    W,
    15,
    C.sky0
  );


  block(
    0,
    31,
    W,
    18,
    C.sky1
  );


  block(
    0,
    49,
    W,
    18,
    C.sky2
  );


  block(
    0,
    67,
    W,
    17,
    C.sky3
  );


  block(
    0,
    84,
    W,
    16,
    C.sky4
  );


  /*
    Chunky blue-hour cloud fields.

    No tiny speckles.
  */

  const clouds = [

    [0, 35, 28, 8, C.cloudDark],

    [19, 32, 36, 7, C.cloudMid],

    [44, 36, 20, 5, C.cloudLight],

    [68, 31, 41, 9, C.cloudDark],

    [100, 34, 31, 6, C.cloudMid],

    [127, 30, 36, 7, C.cloudLight],

    [157, 34, 38, 9, C.cloudMid],

    [191, 31, 49, 8, C.cloudLight],


    [0, 46, 38, 7, C.cloudMid],

    [30, 49, 35, 8, C.cloudLight],

    [58, 45, 44, 7, C.cloudDark],

    [94, 50, 38, 8, C.cloudMid],

    [126, 46, 30, 7, C.cloudLight],

    [153, 48, 39, 8, C.cloudDark],

    [185, 45, 55, 9, C.cloudMid],


    [0, 63, 43, 9, C.sky4],

    [32, 60, 44, 8, C.cloudLight],

    [70, 63, 37, 9, C.cloudMid],

    [103, 59, 42, 8, C.cloudLight],

    [137, 63, 36, 8, C.cloudMid],

    [168, 60, 43, 9, C.cloudLight],

    [204, 64, 36, 8, C.sky5]

  ];


  clouds.forEach(
    ([x,y,w,h,c]) => {

      block(
        x,
        y,
        w,
        h,
        c
      );

    }
  );


  /*
    A few stepped pieces make the
    cloud boundaries feel pixel-painted.
  */

  block(21, 39, 18, 4, C.cloudLight);
  block(47, 43, 23, 4, C.cloudMid);

  block(111, 40, 22, 4, C.cloudLight);
  block(136, 37, 19, 4, C.cloudMid);

  block(184, 40, 29, 4, C.cloudDark);

}



/* =========================================================
   PIXEL MOON

   Stair-step circle, not smooth.
========================================================= */

const moonX = 153;
const moonY = 79;



function drawMoon() {

  /*
    One narrow square halo.
  */

  block(
    moonX - 12,
    moonY - 12,
    24,
    24,
    C.moonGlow
  );


  /*
    Cut corners back to sky color.

    Creates a simple pixel halo ring.
  */

  const behind =
    C.sky3;


  block(
    moonX - 12,
    moonY - 12,
    5,
    5,
    behind
  );

  block(
    moonX + 7,
    moonY - 12,
    5,
    5,
    behind
  );

  block(
    moonX - 12,
    moonY + 7,
    5,
    5,
    behind
  );

  block(
    moonX + 7,
    moonY + 7,
    5,
    5,
    behind
  );


  /*
    Main moon: large chunky stepped circle.
  */

  block(
    moonX - 7,
    moonY - 9,
    14,
    18,
    C.moonEdge
  );


  block(
    moonX - 9,
    moonY - 6,
    18,
    12,
    C.moonEdge
  );


  block(
    moonX - 6,
    moonY - 7,
    12,
    14,
    C.moon
  );


  block(
    moonX - 5,
    moonY - 5,
    10,
    10,
    C.moonCore
  );


  /*
    A few large lunar pixels.
  */

  block(
    moonX - 5,
    moonY - 2,
    3,
    3,
    "#ead69c"
  );


  block(
    moonX + 2,
    moonY + 2,
    2,
    2,
    "#e5cf91"
  );

}



/* =========================================================
   DISTANT BANK

   Large silhouette blocks.
========================================================= */

const horizon = 101;


function drawBank() {

  block(
    0,
    horizon,
    W,
    3,
    C.bank0
  );


  const shapes = [

    [0,   95, 22, 8],

    [15,  92, 26, 11],

    [35,  94, 24, 9],

    [53,  91, 28, 12],

    [75,  94, 30, 9],

    [98,  92, 26, 11],

    [119, 95, 28, 8],

    [141, 91, 27, 12],

    [161, 94, 31, 9],

    [187, 92, 26, 11],

    [206, 95, 34, 8]

  ];


  shapes.forEach(
    ([x,y,w,h],i) => {

      block(
        x,
        y,
        w,
        h,
        i % 3 === 0
          ? C.bank1
          : C.bank0
      );

    }
  );

}



/* =========================================================
   WATER BASE
========================================================= */

function drawWaterBase() {

  block(
    0,
    104,
    W,
    11,
    C.water0
  );


  block(
    0,
    115,
    W,
    10,
    C.water1
  );


  block(
    0,
    125,
    W,
    10,
    C.water2
  );

}



/* =========================================================
   FULL RIVER WAVES

   Whole waves, very low amplitude.
   Travel right very slowly.
========================================================= */

function wave(
  y,
  amplitude,
  wavelength,
  shift,
  color
) {

  for (
    let x = 0;
    x < W;
    x += 2
  ) {

    const py =
      y +
      Math.round(
        Math.sin(
          (x - shift)
          /
          wavelength
        )
        *
        amplitude
      );


    block(
      x,
      py,
      2,
      2,
      color
    );

  }

}



function drawWater(
  time
) {

  /*
    High FPS,
    extremely slow travel.
  */

  const flow =
    time * 0.004;


  wave(
    108,
    1,
    19,
    flow,
    C.wave0
  );


  wave(
    114,
    1,
    24,
    flow * 0.9 + 13,
    C.wave1
  );


  wave(
    121,
    1,
    28,
    flow * 1.05 + 24,
    C.wave0
  );


  wave(
    128,
    2,
    34,
    flow * 0.92 + 7,
    C.wave2
  );


  /*
    Large restrained reflection patches.
  */

  const shimmer =
    Math.round(
      Math.sin(time * 0.002) *
      2
    );


  block(
    moonX - 6 + shimmer,
    105,
    12,
    2,
    C.shine
  );


  block(
    moonX - 4 - shimmer,
    111,
    8,
    2,
    C.shine2
  );


  block(
    moonX - 7 + shimmer,
    118,
    14,
    2,
    C.shine
  );


  block(
    moonX - 4,
    126,
    8,
    2,
    C.shine2
  );


  block(
    moonX - 6 - shimmer,
    132,
    12,
    2,
    C.shine
  );

}



/* =========================================================
   WILLOW

   Chunky staircase stems.

   Soft motion, but controlled.
========================================================= */

const willows = [

  /* left */

  {
    root: 11,
    length: 66,
    bend: 11,
    phase: 0.3,
    density: 0.55
  },

  {
    root: 28,
    length: 89,
    bend: 15,
    phase: 1.0,
    density: 0.80
  },

  {
    root: 45,
    length: 59,
    bend: 10,
    phase: 1.8,
    density: 0.45
  },

  {
    root: 67,
    length: 99,
    bend: 18,
    phase: 2.4,
    density: 0.78
  },


  /* right */

  {
    root: 176,
    length: 65,
    bend: 13,
    phase: 0.7,
    density: 0.45
  },

  {
    root: 189,
    length: 91,
    bend: 17,
    phase: 1.3,
    density: 0.80
  },

  {
    root: 207,
    length: 73,
    bend: 13,
    phase: 2.0,
    density: 0.55
  },

  {
    root: 223,
    length: 101,
    bend: 20,
    phase: 2.8,
    density: 0.85
  ]

];



/* =========================================================
   DRAW ONE WILLOW

   Upper and lower portions have
   separate restrained movement.
========================================================= */

function drawWillow(
  b,
  index,
  time
) {

  /*
    Constant breeze to the right.
  */

  const upper =
    3 +
    Math.round(
      Math.sin(
        time * 0.00065 +
        b.phase
      )
      *
      1.5
    );


  const lower =
    5 +
    Math.round(
      Math.sin(
        time * 0.0009 +
        b.phase * 1.35
      )
      *
      2.5
    );


  const segments =
    Math.floor(
      b.length / 7
    );


  let previousX =
    b.root;


  let previousY =
    -2;


  for (
    let i = 1;
    i <= segments;
    i++
  ) {

    const progress =
      i / segments;


    /*
      Gradual rightward curve.

      Lower half receives more wind,
      but not enough to look like rope.
    */

    let bend =
      b.bend *
      progress *
      progress;


    if (
      progress < 0.45
    ) {

      bend +=
        upper *
        progress;

    }

    else {

      bend +=
        upper * 0.45 +
        lower *
        (
          progress -
          0.45
        );

    }


    const x =
      Math.round(
        b.root +
        bend
      );


    const y =
      Math.round(
        -2 +
        progress *
        b.length
      );


    /*
      Thick staircase stem.

      Every part stays thick.
    */

    drawChunkLine(
      previousX,
      previousY,
      x,
      y,
      C.willow1
    );


    /*
      Leaves as chunky horizontal blocks.
    */

    const seed =
      (
        index * 19 +
        i * 31
      )
      %
      100;


    if (
      seed <
      b.density * 100
    ) {

      if (
        i % 2 === 0
      ) {

        block(
          x + 2,
          y,
          6,
          2,
          C.willow2
        );

      }

      else {

        block(
          x - 5,
          y + 1,
          5,
          2,
          C.willow0
        );

      }

    }


    previousX =
      x;

    previousY =
      y;

  }

}



/* =========================================================
   CHUNK LINE

   Thick and intentionally stair-stepped.
========================================================= */

function drawChunkLine(
  x0,
  y0,
  x1,
  y1,
  color
) {

  const steps =
    Math.max(
      Math.abs(x1 - x0),
      Math.abs(y1 - y0)
    );


  if (
    steps === 0
  ) {
    return;
  }


  for (
    let i = 0;
    i <= steps;
    i += 2
  ) {

    const t =
      i / steps;


    const x =
      Math.round(
        x0 +
        (x1 - x0) *
        t
      );


    const y =
      Math.round(
        y0 +
        (y1 - y0) *
        t
      );


    /*
      Uniform chunky thickness.
    */

    block(
      x,
      y,
      3,
      4,
      color
    );

  }

}



function drawWillows(
  time
) {

  willows.forEach(
    (b,i) => {

      drawWillow(
        b,
        i,
        time
      );

    }
  );

}



/* =========================================================
   PURE PIXEL TITLE

   No font rendering.
========================================================= */

const EN = {

  h: [
    "10001",
    "10001",
    "10001",
    "11111",
    "10001",
    "10001",
    "10001"
  ],

  i: [
    "00100",
    "00000",
    "01100",
    "00100",
    "00100",
    "00100",
    "01110"
  ],

  "'": [
    "00100",
    "00100",
    "01000",
    "00000",
    "00000",
    "00000",
    "00000"
  ],

  m: [
    "00000",
    "00000",
    "11011",
    "10101",
    "10101",
    "10101",
    "10101"
  ]

};



const CN = {

  "山": [

    "001000100",
    "001000100",
    "001000100",
    "001000100",
    "101000101",
    "101000101",
    "101000101",
    "111111111",
    "000000000"

  ],


  "田": [

    "111111111",
    "100010001",
    "100010001",
    "100010001",
    "111111111",
    "100010001",
    "100010001",
    "100010001",
    "111111111"

  ]

};



function matrix(
  data,
  x,
  y,
  size
) {

  data.forEach(
    (row,ry) => {

      [...row].forEach(
        (v,rx) => {

          if (
            v === "1"
          ) {

            block(
              x + rx * size,
              y + ry * size,
              size,
              size,
              C.white
            );

          }

        }
      );

    }
  );

}



/* =========================================================
   TITLE
========================================================= */

function drawTitle() {

  const s =
    2;


  /*
    English width calculations.
  */

  const word =
    ["h","i"," ","i","'","m"];


  const widths = {

    h:5,
    i:5,
    "'":5,
    m:5,
    " ":3

  };


  let enWidth =
    0;


  word.forEach(
    c => {

      enWidth +=
        widths[c] *
        s +
        3;

    }
  );


  const cnWidth =
    (
      9 *
      s +
      5
    )
    *
    3;


  const total =
    enWidth +
    cnWidth;


  let x =
    Math.floor(
      (
        W -
        total
      )
      /
      2
    );


  /*
    Plenty of sky around the title.
  */

  const y =
    65;


  word.forEach(
    c => {

      if (
        c !== " "
      ) {

        matrix(
          EN[c],
          x,
          y + 2,
          s
        );

      }


      x +=
        widths[c] *
        s +
        3;

    }
  );


  ["山","山","田"].forEach(
    c => {

      matrix(
        CN[c],
        x,
        y,
        s
      );


      x +=
        9 *
        s +
        5;

    }
  );

}



/* =========================================================
   ANIMATION
========================================================= */

function render(time) {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawSky();

  drawMoon();

  drawBank();

  drawWaterBase();

  drawWater(time);

  drawWillows(time);

  /*
    Title last:
    always clean pure white.
  */

  drawTitle();


  requestAnimationFrame(
    render
  );

}


requestAnimationFrame(
  render
);

</script>


</body>
</html>
