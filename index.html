<script>

/* ==========================================================
   SETUP
========================================================== */

const canvas =
  document.getElementById("scene");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 180;

const P = 2;


/* ==========================================================
   SCALE
========================================================== */

function fitCanvas() {

  const scale =
    Math.max(
      window.innerWidth / W,
      window.innerHeight / H
    );

  canvas.style.width =
    Math.ceil(
      W * scale
    ) + "px";

  canvas.style.height =
    Math.ceil(
      H * scale
    ) + "px";

}

window.addEventListener(
  "resize",
  fitCanvas
);

fitCanvas();



/* ==========================================================
   PALETTE
========================================================== */

const C = {

  /* SKY */

  sky0:
    [1, 4, 11],

  sky1:
    [2, 8, 22],

  sky2:
    [3, 15, 37],

  sky3:
    [5, 27, 61],

  sky4:
    [7, 42, 88],

  sky5:
    [10, 57, 112],

  sky6:
    [15, 72, 135],


  /* CLOUD */

  cloudShadow:
    "#092756",

  cloudDark:
    "#0d3672",

  cloudMid:
    "#124891",

  cloudLight:
    "#1957a2",


  /* BANK */

  bank0:
    "#06141d",

  bank1:
    "#09212c",


  /* WATER */

  water0:
    "#071c29",

  water1:
    "#092634",

  water2:
    "#0d3040",

  water3:
    "#12394a",


  /* SUBTLE WAVES */

  wave1:
    "#154252",

  wave2:
    "#1b4b5c",

  wave3:
    "#24596a",


  /* WILLOW */

  willowDark:
    "#08342d",

  willow:
    "#0d4a3e",

  willowLight:
    "#155e4c",


  /* MOON */

  halo:
    "#70694f",

  moonEdge:
    "#d6c38b",

  moonMid:
    "#efdda5",

  moon:
    "#fff1c3",

  moonCore:
    "#fffbe8",


  /* REFLECTION */

  shine1:
    "#f7e7b1",

  shine2:
    "#cbbd91",


  white:
    "#ffffff"
};



/* ==========================================================
   BASIC BLOCK
========================================================== */

function block(
  x,
  y,
  w,
  h,
  color
) {

  ctx.fillStyle =
    color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );

}



/* ==========================================================
   RGB MIX
========================================================== */

function mix(
  a,
  b,
  t
) {

  const r =
    Math.round(
      a[0] +
      (
        b[0] -
        a[0]
      ) *
      t
    );

  const g =
    Math.round(
      a[1] +
      (
        b[1] -
        a[1]
      ) *
      t
    );

  const blue =
    Math.round(
      a[2] +
      (
        b[2] -
        a[2]
      ) *
      t
    );

  return (
    "rgb(" +
    r +
    "," +
    g +
    "," +
    blue +
    ")"
  );

}



/* ==========================================================
   SKY
========================================================== */

const horizon =
  135;


function getSkyColor(y) {

  const t =
    y /
    horizon;


  if (
    t <
    0.16
  ) {

    return mix(
      C.sky0,
      C.sky1,
      t / .16
    );

  }


  if (
    t <
    0.34
  ) {

    return mix(
      C.sky1,
      C.sky2,
      (
        t -
        .16
      )
      /
      .18
    );

  }


  if (
    t <
    0.55
  ) {

    return mix(
      C.sky2,
      C.sky3,
      (
        t -
        .34
      )
      /
      .21
    );

  }


  if (
    t <
    0.76
  ) {

    return mix(
      C.sky3,
      C.sky4,
      (
        t -
        .55
      )
      /
      .21
    );

  }


  if (
    t <
    .91
  ) {

    return mix(
      C.sky4,
      C.sky5,
      (
        t -
        .76
      )
      /
      .15
    );

  }


  return mix(
    C.sky5,
    C.sky6,
    (
      t -
      .91
    )
    /
    .09
  );

}



function drawSky() {

  /*
    Uniform 2×2 pixel field.
  */

  for (
    let y = 0;
    y < horizon;
    y += P
  ) {

    const color =
      getSkyColor(y);


    for (
      let x = 0;
      x < W;
      x += P
    ) {

      block(
        x,
        y,
        P,
        P,
        color
      );

    }

  }

}



/* ==========================================================
   CLOUDS

   Each cloud is ONE connected mass.
========================================================== */

const cloudGroups = [

  {

    x: -32,

    speed: 0.000055,

    pieces: [

      [0,  6, 38, 6, C.cloudShadow],

      [16, 2, 52, 8, C.cloudDark],

      [34, 0, 44, 6, C.cloudDark],

      [58, 4, 52, 8, C.cloudMid],

      [82, 8, 35, 6, C.cloudMid],

      [24,10, 74, 8, C.cloudDark],

      [52,14, 58, 6, C.cloudShadow]

    ]

  },


  {

    x: 92,

    speed: 0.000042,

    pieces: [

      [0,  7, 48, 6, C.cloudShadow],

      [21, 3, 58, 8, C.cloudDark],

      [48, 0, 55, 7, C.cloudDark],

      [74, 4, 62, 8, C.cloudMid],

      [108,8, 42, 6, C.cloudMid],

  {

    x: 228,

    speed: 0.000065,

    pieces: [

      [0,  6, 38, 7, C.cloudShadow],

      [17, 2, 55, 8, C.cloudDark],

      [44, 0, 49, 6, C.cloudDark],

      [67, 3, 60, 8, C.cloudMid],

      [96, 7, 48, 7, C.cloudMid],

      [33,11, 91, 8, C.cloudDark],

      [68,15, 62, 6, C.cloudShadow]

    ]

  }

];



function drawClouds(time) {

  cloudGroups.forEach(
    cloud => {

      /*
        Very slow horizontal drift.
      */

      const travel =
        (
          time *
          cloud.speed
        )
        %
        (
          W +
          180
        );


      let baseX =
        cloud.x +
        travel;


      /*
        Wrap.
      */

      if (
        baseX >
        W +
        40
      ) {

        baseX -=
          W +
          180;

      }


      drawCloudMass(
        baseX,
        cloud.y,
        cloud.pieces
      );


      /*
        Wrapped copy.
      */

      drawCloudMass(
        baseX -
        (
          W +
          180
        ),
        cloud.y,
        cloud.pieces
      );

    }
  );

}



function drawCloudMass(
  x,
  y,
  pieces
) {

  pieces.forEach(
    (
      [
        px,
        py,
        w,
        h,
        color
      ]
    ) => {

      block(
        x + px,
        y + py,
        w,
        h,
        color
      );

    }
  );

}



/* ==========================================================
   MOON
========================================================== */

const moonX =
  220;

const moonY =
  108;


function drawMoon() {

  /*
    Small halo ring.
  */

  for (
    let y = -15;
    y <= 15;
    y += P
  ) {

    for (
      let x = -15;
      x <= 15;
      x += P
    ) {

      const edge =
        Math.max(
          Math.abs(x),
          Math.abs(y)
        );


      if (
        edge >=
        13 &&
        edge <=
        15
      ) {

        block(
          moonX + x,
          moonY + y,
          P,
          P,
          C.halo
        );

      }

    }

  }


  /*
    Stepped moon.
  */

  block(
    moonX - 8,
    moonY - 12,
    16,
    24,
    C.moonEdge
  );


  block(
    moonX - 11,
    moonY - 9,
    22,
    18,
    C.moonEdge
  );


  block(
    moonX - 8,
    moonY - 10,
    16,
    20,
    C.moonMid
  );


  block(
    moonX - 9,
    moonY - 7,
    18,
    14,
    C.moonMid
  );


  block(
    moonX - 6,
    moonY - 8,
    13,
    16,
    C.moon
  );


  block(
    moonX - 5,
    moonY - 5,
    10,
    10,
    C.moonCore
  );


  /*
    Texture.
  */

  block(
    moonX - 5,
    moonY - 1,
    3,
    3,
    "#e8d49f"
  );


  block(
    moonX + 2,
    moonY + 4,
    2,
    2,
    "#e3ce94"
  );

}



/* ==========================================================
   DISTANT BANK
========================================================== */

function drawBank() {

  block(
    0,
    horizon,
    W,
    2,
    C.bank0
  );


  const forms = [

    [0,   130, 30, 5],

    [26,  128, 35, 7],

    [56,  131, 38, 4],

    [89,  128, 40, 7],

    [125, 130, 34, 5],

    [154, 129, 38, 6],

    [187, 127, 39, 8],

    [222, 130, 42, 5],

    [259, 128, 38, 7],

    [293, 130, 27, 5]

  ];


  forms.forEach(
    (
      [
        x,
        y,
        w,
        h
      ],
      index
    ) => {

      block(
        x,
        y,
        w,
        h,
        index %
        3 ===
        0
        ? C.bank1
        : C.bank0
      );

    }

}



/* ==========================================================
   WATER
========================================================== */

function drawWaterBase() {

  block(
    0,
    137,
    W,
    12,
    C.water0
  );


  block(
    0,
    149,
    W,
    12,
    C.water1
  );


  block(
    0,
    161,
    W,
    11,
    C.water2
  );


  block(
    0,
    172,
    W,
    8,
    C.water3
  );

}



/* ==========================================================
   SUBTLE WHOLE WAVES
========================================================== */

function drawWave(
  baseY,
  amplitude,
  wavelength,
  shift,
  color
) {

  for (
    let x = 0;
    x < W;
    x += P
  ) {

    const y =
      baseY +
      Math.round(
        Math.sin(
          (
            x -
            shift
          )
          /
          wavelength
        )
        *
        amplitude
      );


    block(
      x,
      y,
      P,
      P,
      color
    );

  }

}



function drawRiver(time) {

  /*
    Extremely slow.
  */

  const flow =
    time *
    0.00055;


  /*
    Similar colors to water:
    more hidden than before.
  */

  drawWave(
    142,
    1,
    25,
    flow,
    C.wave1
  );


  drawWave(
    151,
    1,
    31,
    flow *
    .92 +
    12,
    C.wave2
  );


  drawWave(
    161,
    1,
    37,
    flow *
    1.05 +
    28,
    C.wave1
  );


  drawWave(
    171,
    1,
    43,
    flow *
    .88 +
    9,
    C.wave3
  );


  /*
    A few quiet short highlights.
  */

  const detailOffset =
    (
      time *
      0.0004
    )
    %
    W;


  block(
    (
      39 +
      detailOffset
    )
    %
    W,
    147,
    12,
    2,
    "#174454"
  );


  block(
    (
      127 +
      detailOffset *
      .7
    )
    %
    W,
    157,
    16,
    2,
    "#1b4b5a"
  );


  block(
    (
      250 +
      detailOffset *
      .55
    )
    %
    W,
    168,
    11,
    2,
    "#245564"
  );


  /*
    Moonlight.
  */

  const shimmer =
    Math.round(
      Math.sin(
        time *
        0.00075
      )
      *
      2
    );


  block(
    moonX -
    7 +
    shimmer,
    138,
    14,
    2,
    C.shine1
  );


  block(
    moonX -
    4 -
    shimmer,
    146,
    8,
    2,
    C.shine2
  );


  block(
    moonX -
    8 +
    shimmer,
    155,
    16,
    2,
    C.shine1
  );


  block(
    moonX -
    5,
    165,

    2,

  );


  block(

  );

}

/* ==========================================================
   FINE PIXEL LINE

   Uniform 2×2 thickness.
========================================================== */

function fineLine(
  x0,
  y0,
  x1,
  y1,
  color
) {

  const dx =
    x1 -
    x0;


  const dy =
    y1 -
    y0;


  const distance =
    Math.max(
      Math.abs(dx),
      Math.abs(dy)
    );


  const steps =
    Math.max(
      1,
      Math.ceil(
        distance /
        P
      )
    );


  for (
    let i = 0;
    i <= steps;
    i++
  ) {

    const t =
      i /
      steps;


    const x =
      Math.round(
        x0 +
        dx *
        t
      );


    const y =
      Math.round(
        y0 +
        dy *
        t
      );


    block(
      x,
      y,
      P,
      P,
      color
    );

  }

}



/* ==========================================================
   DRAW WILLOW
========================================================== */

function drawWillow(
  willow,
  index,
  time
) {

  /*
    Gentle constant wind right.
  */

  const windBias =
    3.2;


  /*
    Upper portion barely moves.
  */

  const upperMove =
    Math.sin(
      time *
      0.0003 +
      willow.phase
    )
    *
    0.8;


  /*
    Lower portion moves slightly more.
  */

  const lowerMove =
    Math.sin(
      time *
      0.00043 +
      willow.phase *
      1.35
    )
    *
    1.65;


  const segments =
    Math.max(
      8,
      Math.round(
        willow.length /
        7
      )
    );


  let lastX =
    willow.root;


  let lastY =
    -3;


  for (
    let i = 1;
    i <= segments;
    i++
  ) {

    const progress =
      i /
      segments;


    /*
      Graceful static bend.
  */

    let x =
      willow.root +
      willow.bend *
      progress *
      progress;


    /*
      Wind pushes right.
    */

    x +=
      windBias *
      progress;


    /*
      Upper / lower motion.
    */

    if (
      progress <
      .5
    ) {

      x +=
        upperMove *
        progress;

    }

    else {

      const lp =
        (
          progress -
          .5
        )
        /
        .5;


      x +=
        upperMove *
        .5 +
        lowerMove *
        lp;

    }


    const y =
      -3 +
      progress *
      willow.length;


    fineLine(
      lastX,
      lastY,
      x,
      y,
      C.willow
    );


    /*
      Finer leaves.
    */

    const seed =
      (
        i *
        31 +
        index *
        29
      )
      %
      100;


    if (
      seed <
      willow.density *
      100
    ) {

      if (
        i %
        2 ===
        0
      ) {

        block(
          x + 2,
          y + 1,
          6,
          2,
          C.willowLight
        );

      }

      else {

        block(
          x - 4,
          y + 2,
          5,
          2,
          C.willowDark
        );

      }

    }


    lastX =
      x;


    lastY =
      y;

  }

}



function drawWillows(time) {

  willows.forEach(
    (
      willow,
      index
    ) => {

      drawWillow(
        willow,
        index,
        time
      );

    }
  );

}

    "11111",
    "10001",
    "10001",
    "10001"
  ],

  i: [
    "00100",
    "00000",
    "01100",
    "00100",
    "00100",
    "00100",
    "01110"
  ],

  "'": [
    "00100",
    "00100",
    "01000",
    "00000",
    "00000",
    "00000",
    "00000"
  ],

  m: [
    "00000",
    "00000",
    "11011",
    "10101",
    "10101",
    "10101",
    "10101"
  ]

};



const CN = {

  "山": [
    "001000100",
    "001000100",
    "001000100",
    "001000100",
    "101000101",
    "101000101",
    "101000101",
    "111111111",
    "000000000"
  ],

  "田": [
    "111111111",
    "100010001",
    "100010001",
    "100010001",
    "111111111",
    "100010001",
    "100010001",
    "100010001",
    "111111111"
  ]

};



function matrix(
  data,
  x,
  y,
  scale
) {

  data.forEach(
    (
      row,
      rowIndex
    ) => {

      [...row].forEach(
        (
          value,
          columnIndex
        ) => {

          if (
            value ===
            "1"
          ) {

            block(
              x +
              columnIndex *
              scale,

              y +
              rowIndex *
              scale,

              scale,
              scale,

              C.white
            );

          }

        }
      );

    }
  );

}



/* ==========================================================
   TITLE
========================================================== */

function drawTitle() {

  const scale =
    2;


  const english =
    [
      "h",
      "i",
      " ",
      "i",
      "'",
      "m"
    ];


  const widths = {

    h: 5,
    i: 5,
    "'": 5,
    m: 5,
    " ": 3

  };


  let englishWidth =
    0;


  english.forEach(
    char => {

      englishWidth +=
        widths[char] *
        scale +
        4;

    }
  );


  const chineseWidth =
    (
      9 *
      scale +
      6
    )
    *
    3;


  const total =
    englishWidth +
    chineseWidth;


  let x =
    Math.floor(
      (
        W -
        total
      )
      /
      2
    );


  const y =
    91;


  english.forEach(
    char => {

      if (
        char !==
        " "
      ) {

        matrix(
          EN[char],
          x,
          y + 2,
          scale
        );

      }


      x +=
        widths[char] *
        scale +
        4;

    }
  );


  [
    "山",
    "山",
    "田"
  ].forEach(
    char => {

      matrix(
        CN[char],
        x,
        y,
        scale
      );


      x +=
        9 *
        scale +
        6;

    }
  );

}



/* ==========================================================
   RENDER
========================================================== */

function render(time) {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawSky();

  drawClouds(time);

  drawMoon();

  drawBank();

  drawWaterBase();

  drawRiver(time);

  drawWillows(time);

  drawTitle();


  requestAnimationFrame(
    render
  );

}


requestAnimationFrame(render);

</script>
