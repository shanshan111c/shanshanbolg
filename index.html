   SETUP

   整个画面的最小基础像素：

===================================================== */


const canvas =
  document.getElementById("scene");


const ctx =
  canvas.getContext("2d");


ctx.imageSmoothingEnabled =
  false;



const W =
  320;


const H =
  180;


const PX =
  2;




/* =====================================================
   SCALE
===================================================== */


function fitCanvas() {


  const scale =
    Math.max(

      window.innerWidth / W,

      window.innerHeight / H

    );


  canvas.style.width =
    Math.ceil(
      W * scale
    ) + "px";


  canvas.style.height =
    Math.ceil(
      H * scale
    ) + "px";

}



window.addEventListener(
  "resize",
  fitCanvas
);


fitCanvas();

/* =====================================================
   BASIC 2 × 2 PIXEL
===================================================== */


function px(
  x,
  y,
  color
) {


  ctx.fillStyle =
    color;


  ctx.fillRect(

    Math.round(
      x / PX
    ) * PX,

    Math.round(
      y / PX
    ) * PX,

    PX,

    PX

  );

}




/*
  用 2 × 2 基础像素
  组合成较大的形状
*/


function rect2(
  x,
  y,
  width,
  height,
  color
) {


  for (
    let yy = y;
    yy < y + height;
    yy += PX
  ) {


    for (
      let xx = x;
      xx < x + width;
      xx += PX
    ) {


      px(
        xx,
        yy,
        color
      );


    }

  }

}




/* =====================================================
   RGB MIX
===================================================== */


function mix(
  a,
  b,
  t
) {


  const r =
    Math.round(

      a[0] +
      (
        b[0] -
        a[0]
      ) *
      t

    );


  const g =
    Math.round(

      a[1] +
      (
        b[1] -
        a[1]
      ) *
      t

    );


  const blue =
    Math.round(

      a[2] +
      (
        b[2] -
        a[2]
      ) *
      t

    );


  return (
    "rgb(" +
    r +
    "," +
    g +
    "," +
    blue +
    ")"
  );

}




/* =====================================================
   SKY
===================================================== */


const horizon =
  136;




function skyColor(y) {


  const t =
    y /
    horizon;



  if (
    t <
    0.18
  ) {

    return mix(

      C.sky0,

      C.sky1,

      t /
      0.18

    );

  }



  if (
    t <
    0.38
  ) {

    return mix(

      C.sky1,

      C.sky2,

      (
        t -
        0.18
      )
      /
      0.20

    );

  }



  if (
    t <
    0.60
  ) {

    return mix(

      C.sky2,

      C.sky3,

      (
        t -
        0.38
      )
      /
      0.22

    );

  }



  if (
    t <
    0.80
  ) {

    return mix(

      C.sky3,

      C.sky4,

      (
        t -
        0.60
      )
      /
      0.20

    );

  }



  if (
    t <
    0.93
  ) {

    return mix(

      C.sky4,

      C.sky5,

      (
        t -
        0.80
      )
      /
      0.13

    );

  }



  return mix(

    C.sky5,

    C.sky6,

    (
      t -
      0.93
    )
    /
    0.07

  );

}




function drawSky() {


  for (
    let y = 0;
    y < horizon;
    y += PX
  ) {


    const color =
      skyColor(y);


    for (
      let x = 0;
      x < W;
      x += PX
    ) {


      px(
        x,
        y,
        color
      );

    }

  }

}

function drawCloudMass(
  baseX,
  baseY,
  pieces
) {


  pieces.forEach(
    (

        x,
        y,
        width,
        height,
        color
      ]

function drawClouds(state) {


  clouds.forEach(
    cloud => {


      const wrap =
        W +
        220;


      let x =
        cloud.x +
        state.cloudShift *
        cloud.speed;



      while (
        x >
        W +
        100
      ) {

        x -=
          wrap;

      }



      drawCloudMass(

        x,

        cloud.y,

        cloud.pieces

      );



      drawCloudMass(

        x -
        wrap,

        cloud.y,

        cloud.pieces

      );


    }
  );

}




/* =====================================================
   MOON

   类似你发的参考：
   像素圆 + 斜向明暗层次
===================================================== */


const moonX =
  226;


const moonY =
  110;




const moonPattern = [

  "000000111111111000000",

  "000011111111111110000",

  "000111111111111111000",

  "001111111111111111100",

  "011111111111111111110",

  "011111111111111111110",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "111111111111111111111",

  "011111111111111111110",

  "011111111111111111110",

  "001111111111111111100",

  "000111111111111111000",

  "000011111111111110000",

  "000000111111111000000"

];




function moonShade(
  row,
  column
) {


  /*
    斜向灰阶
  */


  const band =
    Math.floor(

      (
        row +
        column *
        0.55
      )
      /
      3

    );



  if (
    band <= 1
  ) {

    return C.moonEdge0;

  }


  if (
    band <= 3
  ) {

    return C.moonEdge1;

  }


  if (
    band <= 5
  ) {

    return C.moonMid0;

  }


  if (
    band <= 7
  ) {

    return C.moonMid1;

  }


  if (
    band <= 9
  ) {

    return C.moonLite;

  }


  return C.moonCore;

}




function drawMoon() {


  /*
    简单的一圈像素光晕
  */


  for (
    let y = -24;
    y <= 24;
    y += PX
  ) {


    for (
      let x = -24;
      x <= 24;
      x += PX
    ) {


      const dx =
        x /
        PX;


      const dy =
        y /
        PX;


      const distance =
        Math.sqrt(

          dx * dx +

          dy * dy

        );



      if (
        distance >
        11.5 &&
        distance <
        12.6
      ) {


        px(

          moonX +
          x,

          moonY +
          y,

          C.halo

        );

      }

    }

  }



  /*
    月亮主体
  */


  const startX =
    moonX -
    20;


  const startY =
    moonY -
    18;



  moonPattern.forEach(
    (
      row,
      rowIndex
    ) => {


      [...row].forEach(
        (
          value,
          columnIndex
        ) => {


          if (
            value ===
            "1"
          ) {


            px(

              startX +
              columnIndex *
              PX,

              startY +
              rowIndex *
              PX,

              moonShade(
                rowIndex,
                columnIndex
              )

            );

          }

        }
      );

    }
  );

}

/* =====================================================
   WATER BASE
===================================================== */


function waterColor(y) {


  const t =

    (
      y -
      horizon
    )
    /
    (
      H -
      horizon
    );



  if (
    t <
    0.35
  ) {


    return mix(

      C.water0,

      C.water1,

      t /
      0.35

    );

  }



  if (
    t <
    0.70
  ) {


    return mix(

      C.water1,

      C.water2,

      (
        t -
        0.35
      )
      /
      0.35

    );

  }



  return mix(

    C.water2,

    C.water3,

    (
      t -
      0.70
    )
    /
    0.30

  );

}




function drawWaterBase() {


  for (
    let y =
      horizon +
      2;

    y < H;

    y += PX
  ) {


    const color =
      waterColor(y);


    for (
      let x = 0;

      x < W;

      x += PX
    ) {


      px(
        x,
        y,
        color
      );

    }

  }

}




/* =====================================================
   WHOLE WAVES

   每一条都是完整波
===================================================== */


function fullWave(
  baseY,
  amplitude,
  wavelength,
  shift,
  color
) {


  let lastY =
    baseY;



  for (
    let x = 0;

    x < W;

    x += PX
  ) {


    const rawY =

      baseY +

      Math.sin(

        (
          x -
          shift
        )
        /
        wavelength

      )
      *
      amplitude;



    const y =

      Math.round(

        rawY /
        PX

      )
      *
      PX;



    px(
      x,
      y,
      color
    );



    if (
      y !==
      lastY
    ) {


      px(

        x,

        Math.min(
          y,
          lastY
        ),

        color

      );

    }


    lastY =
      y;

  }

}




/* =====================================================
   WATER SPARKLES

   小闪光
   波光粼粼
===================================================== */


const sparkles =
  [];



for (
  let i = 0;
  i < 42;
  i++
) {


  sparkles.push({

    x:
      8 +
      (
        i *
        19
      )
      %
      300,

    y:
      142 +
      (
        i *
        7
      )
      %
      34,

    phase:
      i *
      0.73,

    speed:
      0.0018 +
      (
        i %
        5
      )
      *
      0.00023,

    drift:
      0.10 +
      (
        i %
        4
      )
      *
      0.05,

    size:
      i %
      4 ===
      0
      ?
      4
      :
      2

  });

}




function drawSparkles(state) {


  sparkles.forEach(
    sparkle => {


      const flicker =

        0.5 +

        0.5 *

        Math.sin(

          state.time *
          sparkle.speed +

          sparkle.phase

        );



      /*
        不是一直亮
        只有部分时间出现
      */

      if (
        flicker >
        0.78
      ) {


        const driftX =

          Math.round(

            Math.sin(

              state.time *
              0.00045 +

              sparkle.phase

            )
            *
            (
              2 +
              sparkle.drift *
              8
            )
            /
            PX

          )
          *
          PX;



        const driftY =

          Math.round(

            Math.sin(

              state.time *
              0.00062 +

              sparkle.phase *
              1.7

            )
            /
            PX

          )
          *
          PX;



        const color =

          flicker >
          0.92

          ?

          C.sparkle1

          :

          C.sparkle0;



        rect2(

          sparkle.x +
          driftX,

          sparkle.y +
          driftY,

          sparkle.size,

          2,

          color

        );

      }

    }
  );

}

/* =====================================================
   STEM LINE

   全部柳枝：
   2 × 2 粗
===================================================== */


function stemLine(
  x0,
  y0,
  x1,
  y1,
  color
) {


  const dx =
    x1 -
    x0;


  const dy =
    y1 -
    y0;



  const distance =

    Math.max(

      Math.abs(dx),

      Math.abs(dy)

    );



  const steps =

    Math.max(

      1,

      Math.ceil(

        distance /
        PX

      )

    );



  for (
    let i = 0;
    i <= steps;
    i++
  ) {


    const t =
      i /
      steps;



    px(

      x0 +
      dx *
      t,

      y0 +
      dy *
      t,

      color

    );

  }

}




/* =====================================================
   DRAW ONE WILLOW
===================================================== */


function drawOneWillow(
  willow,
  index,
  state
) {


  /*
    恒定向右的轻风
  */


  const wind =
    3.4;



  /*
    上半段：
    摆动非常轻
  */


  const upperSway =

    Math.sin(

      state.time *
      0.00055 +

      willow.phase

    )
    *
    0.65;



  /*
    下半段：
    稍微柔一点
  */


  const lowerSway =

    Math.sin(

      state.time *
      0.00082 +

      willow.phase *
      1.4

    )
    *
    1.35;



  const segments =

    Math.max(

      8,

      Math.round(

        willow.length /
        7

      )

    );



  let previousX =
    willow.root;


  let previousY =
    -4;



  for (
    let i = 1;
    i <= segments;
    i++
  ) {


    const p =
      i /
      segments;



    /*
      基础自然弧线
    */


    let x =

      willow.root +

      willow.bend *

      p *

      p;



    /*
      风向右
    */


    x +=
      wind *
      p;



    /*
      上下两段分别运动
    */


    if (
      p <
      0.52
    ) {


      x +=
        upperSway *
        p;

    }


    else {


      const lowerProgress =

        (
          p -
          0.52
        )
        /
        0.48;



      x +=

        upperSway *
        0.52 +

        lowerSway *
        lowerProgress;

    }



    const y =

      -4 +

      willow.length *
      p;



    /*
      锁定 2×2 网格
    */


    const gridX =

      Math.round(
        x /
        PX
      )
      *
      PX;


    const gridY =

      Math.round(
        y /
        PX
      )
      *
      PX;



    stemLine(

      previousX,

      previousY,

      gridX,

      gridY,

      C.willow

    );



    /*
      柳叶
    */


    const seed =

      (
        index *
        41 +

        i *
        29
      )
      %
      100;



    if (
      seed <
      willow.density *
      100
    ) {


      if (
        i %
        3 ===
        0
      ) {


        px(

          gridX +
          2,

          gridY,

          C.willowLight

        );


        px(

          gridX +
          4,

          gridY,

          C.willowLight

        );

      }


      else if (
        i %
        3 ===
        1
      ) {


        px(

          gridX -
          2,

          gridY +
          2,

          C.willowDark

        );


        px(

          gridX -
          4,

          gridY +
          2,

          C.willowDark

        );

      }


      else {


        px(

          gridX +
          2,

          gridY +
          2,

          C.willowLight

        );

      }

    }



    previousX =
      gridX;


    previousY =
      gridY;

  }

}




function drawWillows(state) {


  willows.forEach(
    (
      willow,
      index
    ) => {


      drawOneWillow(

        willow,

        index,

        state

      );

    }
  );

}

function drawMatrix(
  matrix,
  x,
  y
) {


  matrix.forEach(
    (
      row,
      rowIndex
    ) => {


      [...row].forEach(
        (
          value,
          columnIndex
        ) => {


          if (
            value ===
            "1"
          ) {


            px(

              x +
              columnIndex *
              PX,

              y +
              rowIndex *
              PX,

              C.white

            );

          }

        }
      );

    }
  );

}




/* =====================================================
   TITLE
===================================================== */


function drawTitle() {


  const english =

    [
      "h",
      "i",
      " ",
      "i",
      "'",
      "m"
    ];



  const widths = {

    h:
      5,

    i:
      5,

    "'":
      5,

    m:
      5,

    " ":
      3

  };



  const letterGap =
    4;



  let englishWidth =
    0;



  english.forEach(
    char => {


      englishWidth +=

        widths[char] *
        PX +

        letterGap;

    }
  );



  const chineseGap =
    6;



  const chineseWidth =

    3 *
    (
      9 *
      PX
    )
    +

    2 *
    chineseGap;



  const totalWidth =

    englishWidth +

    10 +

    chineseWidth;



  let x =

    Math.round(

      (
        (
          W -
          totalWidth
        )
        /
        2
      )
      /
      PX

    )
    *
    PX;



  const y =
    88;



  english.forEach(
    char => {


      if (
        char !==
        " "
      ) {


        drawMatrix(

          EN[char],

          x,

          y +
          2

        );

      }



      x +=

        widths[char] *
        PX +

        letterGap;

    }
  );



  x +=
    6;



  [
    "山",
    "山",
    "田"
  ].forEach(
    (
      char,
      index
    ) => {


      drawMatrix(

        CN[char],

        x,

        y

      );



      x +=
        9 *
        PX;



      if (
        index <
        2
      ) {


        x +=
          chineseGap;

      }

    }
  );

}




/* =====================================================
   TIME-BASED ANIMATION

   高帧率 ≠ 高速度
===================================================== */


const state = {


  time:
    0,


  flow:
    0,


  cloudShift:
    0,


  lastStamp:
    0

};




/* =====================================================
   RENDER
===================================================== */


function render(stamp) {


  if (
    !state.lastStamp
  ) {


    state.lastStamp =
      stamp;

  }



  let dt =

    (
      stamp -
      state.lastStamp
    )
    /
    1000;



  /*
    切换标签页回来后
    避免突然跳跃
  */


  if (
    dt >
    0.04
  ) {


    dt =
      0.04;

  }



  state.lastStamp =
    stamp;


  state.time =
    stamp;



  /*
    水非常慢地向右
  */


  state.flow +=
    dt *
    1.3;



  /*
    云甚至更慢
  */


  state.cloudShift +=
    dt *
    1.0;



  ctx.clearRect(
    0,
    0,
    W,
    H
  );



  drawSky();


  drawClouds(
    state
  );


  drawMoon();


  drawHorizon();


  drawWaterBase();


  drawRiver(
    state
  );


  drawWillows(
    state
  );


  /*
    文字最后画
    保证纯白清晰
  */


  drawTitle();



  requestAnimationFrame(
    render
  );

}
