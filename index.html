<script>

/* ==========================================================
   BASIC SETUP
========================================================== */

const canvas = document.getElementById("scene");

const ctx = canvas.getContext("2d");

const W = 240;
const H = 135;

/*
  Fundamental pixel unit.
*/

const P = 2;

ctx.imageSmoothingEnabled = false;



/* ==========================================================
   SCALE CANVAS
========================================================== */

function fitCanvas() {

  const scale = Math.max(
    window.innerWidth / W,
    window.innerHeight / H
  );

  canvas.style.width =
    Math.ceil(W * scale) + "px";

  canvas.style.height =
    Math.ceil(H * scale) + "px";

}

window.addEventListener("resize", fitCanvas);

fitCanvas();



/* ==========================================================
   COLOR PALETTE
========================================================== */

const C = {

  /* BLUE-HOUR SKY */

  sky0: [1, 4, 11],
  sky1: [2, 9, 24],
  sky2: [4, 18, 43],
  sky3: [6, 31, 67],
  sky4: [8, 45, 91],
  sky5: [12, 60, 115],
  sky6: [19, 76, 139],

  /* CLOUDS */

  cloudDark: "#09244c",
  cloudMid:  "#10366e",
  cloudBlue: "#174a93",
  cloudLite: "#225db0",

  /* HORIZON */

  bankDark: "#06131c",
  bankMid:  "#09202b",

  /* WATER */

  water0: "#071d2b",
  water1: "#0b2b3c",
  water2: "#10394d",
  water3: "#17495d",

  wave1: "#20586c",
  wave2: "#2c6b7e",
  wave3: "#438497",

  /* WILLOW */

  willowDark: "#07362f",
  willow:     "#0d5143",
  willowLite: "#176854",

  /* MOON */

  halo:      "#756c50",
  moonEdge:  "#d8c58c",
  moonMid:   "#f2dea0",
  moon:      "#fff2bd",
  moonCore:  "#fffbe6",

  /* REFLECTION */

  shine1: "#fff1ba",
  shine2: "#dbc995",

  white: "#ffffff"
};



/* ==========================================================
   BASIC BLOCK
========================================================== */

function block(x, y, w, h, color) {

  ctx.fillStyle = color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );

}



/* ==========================================================
   COLOR MIX
========================================================== */

function mix(a, b, amount) {

  const r = Math.round(
    a[0] + (b[0] - a[0]) * amount
  );

  const g = Math.round(
    a[1] + (b[1] - a[1]) * amount
  );

  const blue = Math.round(
    a[2] + (b[2] - a[2]) * amount
  );

  return `rgb(${r},${g},${blue})`;

}



/* ==========================================================
   SKY

   No random noise.
   The whole sky is made from 2 × 2 color blocks.
========================================================== */

const horizon = 101;



function getSkyColor(y) {

  const t = y / horizon;

  if (t < 0.16) {

    return mix(
      C.sky0,
      C.sky1,
      t / 0.16
    );

  }

  if (t < 0.34) {

    return mix(
      C.sky1,
      C.sky2,
      (t - 0.16) / 0.18
    );

  }

  if (t < 0.56) {

    return mix(
      C.sky2,
      C.sky3,
      (t - 0.34) / 0.22
    );

  }

  if (t < 0.78) {

    return mix(
      C.sky3,
      C.sky4,
      (t - 0.56) / 0.22
    );

  }

  if (t < 0.92) {

    return mix(
      C.sky4,
      C.sky5,
      (t - 0.78) / 0.14
    );

  }

  return mix(
    C.sky5,
    C.sky6,
    (t - 0.92) / 0.08
  );

}



function drawSky() {

  /*
    Every sky piece = same 2 × 2 pixel unit.
  */

  for (
    let y = 0;
    y < horizon;
    y += P
  ) {

    const color =
      getSkyColor(y);


    for (
      let x = 0;
      x < W;
      x += P
    ) {

      block(
        x,
        y,
        P,
        P,
        color
      );

    }

  }



  /*
    Large chunky clouds.

    No thin lines.
    No vertical artifacts.
  */

  const clouds = [

    /*
      upper-left
    */

    [0, 34, 30, 4, C.cloudDark],
    [14, 32, 25, 4, C.cloudMid],
    [27, 36, 31, 4, C.cloudBlue],

    [5, 40, 37, 4, C.cloudMid],
    [29, 42, 25, 4, C.cloudBlue],


    /*
      upper-center
    */

    [63, 31, 39, 4, C.cloudDark],
    [78, 35, 43, 5, C.cloudMid],
    [98, 39, 32, 4, C.cloudBlue],


    /*
      upper-right
    */

    [139, 30, 30, 4, C.cloudBlue],
    [155, 33, 42, 5, C.cloudMid],
    [183, 36, 57, 5, C.cloudBlue],

    [176, 42, 34, 4, C.cloudDark],
    [202, 44, 38, 5, C.cloudMid],


    /*
      lower atmosphere
    */

    [0, 58, 45, 5, C.cloudBlue],
    [28, 62, 42, 4, C.cloudLite],

    [64, 57, 44, 5, C.cloudMid],
    [92, 61, 40, 5, C.cloudBlue],

    [129, 57, 40, 5, C.cloudLite],
    [158, 61, 45, 5, C.cloudBlue],

    [196, 58, 44, 5, C.cloudLite]

  ];


  clouds.forEach(
    ([x,y,w,h,c]) => {

      block(
        x,
        y,
        w,
        h,
        c
      );

    }
  );



  /*
    Stepped cloud edges.
  */

  block(
    18,
    38,
    18,
    3,
    C.cloudBlue
  );

  block(
    43,
    45,
    17,
    3,
    C.cloudMid
  );

  block(
    89,
    42,
    22,
    3,
    C.cloudBlue
  );

  block(
    151,
    39,
    20,
    3,
    C.cloudLite
  );

}



/* ==========================================================
   MOON

   Larger + lower.
========================================================== */

const moonX = 159;
const moonY = 82;



function drawMoon() {

  /*
    One simple pixel halo ring.
  */

  for (
    let y = -13;
    y <= 13;
    y += P
  ) {

    for (
      let x = -13;
      x <= 13;
      x += P
    ) {

      const distance =
        Math.max(
          Math.abs(x),
          Math.abs(y)
        );


      if (
        distance >= 11 &&
        distance <= 13
      ) {

        block(
          moonX + x,
          moonY + y,
          P,
          P,
          C.halo
        );

      }

    }

  }



  /*
    Stepped pixel moon.
  */

  block(
    moonX - 7,
    moonY - 10,
    14,
    20,
    C.moonEdge
  );


  block(
    moonX - 10,
    moonY - 7,
    20,
    14,
    C.moonEdge
  );


  block(
    moonX - 7,
    moonY - 8,
    14,
    16,
    C.moonMid
  );


  block(
    moonX - 8,
    moonY - 5,
    16,
    10,
    C.moonMid
  );


  block(
    moonX - 5,
    moonY - 6,
    11,
    12,
    C.moon
  );


  block(
    moonX - 4,
    moonY - 4,
    8,
    8,
    C.moonCore
  );


  /*
    Moon texture.
  */

  block(
    moonX - 5,
    moonY - 1,
    3,
    3,
    "#e6d19a"
  );


  block(
    moonX + 2,
    moonY + 3,
    2,
    2,
    "#e1cc91"
  );

}



/* ==========================================================
   DISTANT BANK
========================================================== */

function drawBank() {

  /*
    Horizon itself stays almost completely flat.
  */

  block(
    0,
    horizon,
    W,
    2,
    C.bankDark
  );


  const bank = [

    [0,   96, 22, 5],

    [17,  94, 25, 7],

    [37,  96, 27, 5],

    [60,  93, 30, 8],

    [86,  96, 26, 5],

    [108, 94, 27, 7],

    [131, 96, 25, 5],

    [151, 93, 29, 8],

    [176, 96, 28, 5],

    [200, 94, 26, 7],

    [221, 96, 19, 5]

  ];


  bank.forEach(
    ([x,y,w,h], index) => {

      block(
        x,
        y,
        w,
        h,
        index % 3 === 0
          ? C.bankMid
          : C.bankDark
      );

    }
  );

}



/* ==========================================================
   WATER BACKGROUND
========================================================== */

function drawWaterBase() {

  block(
    0,
    103,
    W,
    10,
    C.water0
  );


  block(
    0,
    113,
    W,
    9,
    C.water1
  );


  block(
    0,
    122,
    W,
    8,
    C.water2
  );


  block(
    0,
    130,
    W,
    5,
    C.water3
  );

}



/* ==========================================================
   WHOLE WAVE

   Continuous wave moving RIGHT.
========================================================== */

function drawWave(
  baseY,
  amplitude,
  wavelength,
  shift,
  color
) {

  for (
    let x = 0;
    x < W;
    x += P
  ) {

    const y =
      baseY +
      Math.round(
        Math.sin(
          (x - shift)
          /
          wavelength
        )
        *
        amplitude
      );


    block(
      x,
      y,
      P,
      P,
      color
    );

  }

}



/* ==========================================================
   RIVER

   High FPS.
   Very slow movement.
========================================================== */

function drawRiver(time) {

  /*
    About 0.7 pixel per second.

    Very slow,
    while requestAnimationFrame remains smooth.
  */

  const flow =
    time * 0.0007;


  drawWave(
    107,
    1,
    19,
    flow,
    C.wave1
  );


  drawWave(
    113,
    1,
    23,
    flow * 0.9 + 12,
    C.wave2
  );


  drawWave(
    120,
    1,
    27,
    flow * 1.05 + 25,
    C.wave1
  );


  drawWave(
    127,
    1,
    31,
    flow * 0.92 + 7,
    C.wave3
  );


  drawWave(
    133,
    1,
    35,
    flow + 19,
    C.wave2
  );



  /*
    Slow broken moon reflection.
  */

  const shimmer =
    Math.round(
      Math.sin(
        time * 0.0009
      )
      *
      2
    );


  block(
    moonX - 6 + shimmer,
    104,
    12,
    2,
    C.shine1
  );


  block(
    moonX - 4 - shimmer,
    110,
    8,
    2,
    C.shine2
  );


  block(
    moonX - 7 + shimmer,
    117,
    14,
    2,
    C.shine1
  );


  block(
    moonX - 4,
    124,
    8,
    2,
    C.shine2
  );


  block(
    moonX - 6 - shimmer,
    131,
    12,
    2,
    C.shine1
  );

}

/* ==========================================================
   THICK PIXEL LINE

   Every stem has the SAME thickness.
========================================================== */

function thickPixelLine(
  x0,
  y0,
  x1,
  y1,
  color
) {

  const dx =
    x1 - x0;


  const dy =
    y1 - y0;


  const distance =
    Math.max(
      Math.abs(dx),
      Math.abs(dy)
    );


  const steps =
    Math.max(
      1,
      Math.ceil(
        distance / P
      )
    );


  for (
    let i = 0;
    i <= steps;
    i++
  ) {

    const t =
      i / steps;


    const x =
      Math.round(
        x0 +
        dx * t
      );


    const y =
      Math.round(
        y0 +
        dy * t
      );


    /*
      Uniform 4 × 4 chunky stem.
    */

    block(
      x,
      y,
      4,
      4,
      color
    );

  }

}



/* ==========================================================
   WILLOW

   Upper and lower parts move differently,
   but movement is restrained.
========================================================== */

function drawOneWillow(
  willow,
  index,
  time
) {

  /*
    Constant breeze pushes right.
  */

  const windBias =
    4;


  /*
    Upper branch:
    almost stable.
  */

  const upperMove =
    Math.sin(
      time * 0.00038 +
      willow.phase
    )
    *
    1.2;


  /*
    Lower branch:
    slightly more responsive,
    but still controlled.
  */

  const lowerMove =
    Math.sin(
      time * 0.00052 +
      willow.phase * 1.4
    )
    *
    2.2;


  const segments =
    Math.max(
      6,
      Math.round(
        willow.length / 8
      )
    );


  let lastX =
    willow.root;


  let lastY =
    -4;


  for (
    let i = 1;
    i <= segments;
    i++
  ) {

    const progress =
      i / segments;


    /*
      Main static rightward curve.
  */

    let x =
      willow.root +
      willow.bend *
      progress *
      progress;


    /*
      Wind direction always points right.
    */

    x +=
      windBias *
      progress;


    /*
      Upper/lower movement separated.
    */

    if (
      progress < 0.48
    ) {

      x +=
        upperMove *
        progress;

    }

    else {

      const lowerProgress =
        (
          progress -
          0.48
        )
        /
        0.52;


      x +=
        upperMove * 0.48 +
        lowerMove *
        lowerProgress;

    }


    const y =
      -4 +
      progress *
      willow.length;


    /*
      All stems equally thick.
    */

    thickPixelLine(
      lastX,
      lastY,
      x,
      y,
      C.willow
    );


    /*
      Leaves:
      chunky and irregular.
    */

    const seed =
      (
        i * 31 +
        index * 23
      )
      %
      100;


    if (
      seed <
      willow.density * 100
    ) {

      if (
        i % 2 === 0
      ) {

        block(
          x + 3,
          y + 1,
          7,
          2,
          C.willowLite
        );


        block(
          x + 5,
          y + 3,
          5,
          2,
          C.willow
        );

      }

      else {

        block(
          x - 5,
          y + 2,
          6,
          2,
          C.willowDark
        );

      }

    }


    lastX =
      x;

    lastY =
      y;

  }

}



function drawWillows(time) {

  willows.forEach(
    (willow,index) => {

      drawOneWillow(
        willow,
        index,
        time
      );

    }
  );

}

function matrix(
  data,
  x,
  y,
  scale
) {

  data.forEach(
    (row, rowIndex) => {

      [...row].forEach(
        (value, columnIndex) => {

          if (
            value === "1"
          ) {

            block(
              x +
              columnIndex *
              scale,

              y +
              rowIndex *
              scale,

              scale,
              scale,

              C.white
            );

          }

        }
      );

    }
  );

}



/* ==========================================================
   TITLE
========================================================== */

function drawTitle() {

  const scale =
    2;


  const english =
    ["h","i"," ","i","'","m"];


  const widths = {

    h: 5,
    i: 5,
    "'": 5,
    m: 5,
    " ": 3

  };


  let englishWidth =
    0;


  english.forEach(
    char => {

      englishWidth +=
        widths[char] *
        scale +
        3;

    }
  );


  const chineseWidth =
    (
      9 *
      scale +
      5
    )
    *
    3;


  const totalWidth =
    englishWidth +
    chineseWidth;


  let x =
    Math.floor(
      (
        W -
        totalWidth
      )
      /
      2
    );


  const y =
    64;



  english.forEach(
    char => {

      if (
        char !== " "
      ) {

        matrix(
          EN[char],
          x,
          y + 2,
          scale
        );

      }


      x +=
        widths[char] *
        scale +
        3;

    }
  );



  ["山","山","田"].forEach(
    char => {

      matrix(
        CN[char],
        x,
        y,
        scale
      );


      x +=
        9 *
        scale +
        5;

    }
  );

}



/* ==========================================================
   MAIN LOOP
========================================================== */

function render(time) {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Back → front
  */

  drawSky();

  drawMoon();

  drawBank();

  drawWaterBase();

  drawRiver(time);

  drawWillows(time);

  /*
    Always draw text last
    so it stays pure white.
  */

  drawTitle();


  requestAnimationFrame(
    render
  );

}



/*
  Start animation.
*/

requestAnimationFrame(render);

</script>
