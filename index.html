/* =====================================================
   SETUP
   最小像素单元始终 = 2 × 2
===================================================== */

const canvas =
  document.getElementById("scene");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled =
  false;

const W =
  320;

const H =
  180;

const PX =
  2;


/* =====================================================
   SCALE
===================================================== */

function fitCanvas() {

  const scale =
    Math.max(
      window.innerWidth / W,
      window.innerHeight / H
    );

  canvas.style.width =
    Math.ceil(W * scale) + "px";

  canvas.style.height =
    Math.ceil(H * scale) + "px";
}

window.addEventListener(
  "resize",
  fitCanvas
);

fitCanvas();


/* =====================================================
   COLORS
===================================================== */

const C = {

  /* SKY */

  sky0: [1,4,11],
  sky1: [2,8,21],
  sky2: [3,15,37],
  sky3: [5,26,58],
  sky4: [7,39,81],
  sky5: [10,54,106],
  sky6: [14,69,128],

  /* CLOUD */

  cloud0: "#061833",
  cloud1: "#082349",

  /* WATER */

  water0: [5,21,31],
  water1: [6,29,40],
  water2: [8,37,49],
  water3: [10,45,58],

  wave0: "#0d3342",
  wave1: "#103c4c",
  wave2: "#144656",

  /* WILLOW */

  willowDark: "#07332c",
  willow: "#0b493d",
  willowLight: "#135c4a",

  /* MOON */

  moonDark: "#bab3a1",
  moonEdge: "#cbc5b3",
  moonMid: "#ddd8c9",
  moonLight: "#efeadf",
  moonCore: "#fffdf2",

  /* WATER LIGHT */

  reflection0: "#bdb498",
  reflection1: "#dcd1ac",
  reflection2: "#f2e7c4",

  sparkle0: "#d7d0ba",
  sparkle1: "#f7f3df",

  white: "#ffffff"
};


/* =====================================================
   BASIC PIXEL
===================================================== */

function px(
  x,
  y,
  color,
  alpha = 1
) {

  ctx.globalAlpha =
    alpha;

  ctx.fillStyle =
    color;

  ctx.fillRect(

    Math.round(x / PX) * PX,

    Math.round(y / PX) * PX,

    PX,
    PX

  );

  ctx.globalAlpha =
    1;
}


function rect2(
  x,
  y,
  width,
  height,
  color,
  alpha = 1
) {

  for (
    let yy = y;
    yy < y + height;
    yy += PX
  ) {

    for (
      let xx = x;
      xx < x + width;
      xx += PX
    ) {

      px(
        xx,
        yy,
        color,
        alpha
      );

    }

  }
}


/* =====================================================
   COLOR MIX
===================================================== */

function mix(
  a,
  b,
  t
) {

  const r =
    Math.round(
      a[0] +
      (b[0] - a[0]) * t
    );

  const g =
    Math.round(
      a[1] +
      (b[1] - a[1]) * t
    );

  const blue =
    Math.round(
      a[2] +
      (b[2] - a[2]) * t
    );

  return `rgb(${r},${g},${blue})`;
}


/* =====================================================
   SKY
===================================================== */

const horizon =
  136;


function skyColor(y) {

  const t =
    y / horizon;


  if (t < 0.18) {

    return mix(
      C.sky0,
      C.sky1,
      t / 0.18
    );

  }


  if (t < 0.38) {

    return mix(
      C.sky1,
      C.sky2,
      (t - 0.18) / 0.20
    );

  }


  if (t < 0.60) {

    return mix(
      C.sky2,
      C.sky3,
      (t - 0.38) / 0.22
    );

  }


  if (t < 0.80) {

    return mix(
      C.sky3,
      C.sky4,
      (t - 0.60) / 0.20
    );

  }


  if (t < 0.93) {

    return mix(
      C.sky4,
      C.sky5,
      (t - 0.80) / 0.13
    );

  }


  return mix(
    C.sky5,
    C.sky6,
    (t - 0.93) / 0.07
  );
}


function drawSky() {

  for (
    let y = 0;
    y < horizon;
    y += PX
  ) {

    const color =
      skyColor(y);


    for (
      let x = 0;
      x < W;
      x += PX
    ) {

      px(
        x,
        y,
        color
      );

    }

  }
}

function drawCloudMass(
  baseX,
  baseY,
  pieces
) {

  pieces.forEach(
    (
      [
        x,
        y,
        width,
        height,
        color
      ]
    ) => {

      rect2(

        baseX + x,

        baseY + y,

        width,

        height,

        color

      );

    }
  );
}


function drawClouds(state) {

  clouds.forEach(
    cloud => {

      const wrap =
        W + 220;


      let x =
        cloud.x +
        state.cloudShift *
        cloud.speed;


      while (
        x >
        W + 100
      ) {

        x -=
          wrap;

      }


      drawCloudMass(
        x,
        cloud.y,
        cloud.pieces
      );


      drawCloudMass(
        x - wrap,
        cloud.y,
        cloud.pieces
      );

    }
  );
}


/* =====================================================

const moonX =

const moonY =

const moonPattern = [

  "000000111111111000000",
  "000011111111111110000",
  "000111111111111111000",
  "001111111111111111100",
  "011111111111111111110",
  "011111111111111111110",
  "111111111111111111111",

  "111111111111111111111",

  "001111111111111111100",
  "000111111111111111000",
  "000011111111111110000",
  "000000111111111000000"

];


/* =====================================================
   MOON SELF GLOW
===================================================== */

function drawMoonGlow() {

  const moonRadius =
    19;

  const maxRadius =
    38;


  for (
    let y = -maxRadius;
    y <= maxRadius;
    y += PX
  ) {

    for (
      let x = -maxRadius;
      x <= maxRadius;
      x += PX
    ) {

      const distance =
        Math.sqrt(
          x * x +
          y * y
        );


      if (
        distance >
        moonRadius &&
        distance <
        maxRadius
      ) {

        const strength =
          1 -
          (
            distance -
            moonRadius
          )
          /
          (
            maxRadius -
            moonRadius
          );


        /*
          靠月亮更亮，
          向外自然消失
        */

        const alpha =
          strength *
          strength *
          0.13;


        px(
          moonX + x,
          moonY + y,
          "#fff1bd",
          alpha
        );

      }

    }

  }
}


function moonShade(
  row,
  column
) {

  const value =
    row +
    column *
    0.5;


  if (value < 7) {
    return C.moonDark;
  }


  if (value < 12) {
    return C.moonEdge;
  }


  if (value < 17) {
    return C.moonMid;
  }


  if (value < 22) {
    return C.moonLight;
  }


  return C.moonCore;
}


function drawMoon() {

  drawMoonGlow();


  const startX =
    moonX - 20;

  const startY =
    moonY - 18;


  moonPattern.forEach(
    (
      row,
      rowIndex
    ) => {

      [...row].forEach(
        (
          value,
          columnIndex
        ) => {

          if (
            value === "1"
          ) {

            px(

              startX +
              columnIndex * PX,

              startY +
              rowIndex * PX,

              moonShade(
                rowIndex,
                columnIndex
              )

            );

          }

        }
      );

    }
  );
}

/* =====================================================
   WATER
===================================================== */

function waterColor(y) {

  const t =
    (
      y -
      horizon
    )
    /
    (
      H -
      horizon
    );


  if (t < 0.35) {

    return mix(
      C.water0,
      C.water1,
      t / 0.35
    );

  }


  if (t < 0.70) {

    return mix(
      C.water1,
      C.water2,
      (t - 0.35) / 0.35
    );

  }


  return mix(
    C.water2,
    C.water3,
    (t - 0.70) / 0.30
  );
}


function drawWaterBase() {

  for (
    let y =
      horizon + 2;
    y < H;
    y += PX
  ) {

    const color =
      waterColor(y);


    for (
      let x = 0;
      x < W;
      x += PX
    ) {

      px(
        x,
        y,
        color
      );

    }

  }
}


/* =====================================================
   FULL WAVE
===================================================== */

function fullWave(
  baseY,
  amplitude,
  wavelength,
  shift,
  color
) {

  let previousY =
    baseY;


  for (
    let x = 0;
    x < W;
    x += PX
  ) {

    const y =
      Math.round(
        (
          baseY +
          Math.sin(
            (
              x -
              shift
            )
            /
            wavelength
          )
          *
          amplitude
        )
        /
        PX
      )
      *
      PX;


    px(
      x,
      y,
      color
    );


    if (
      y !==
      previousY
    ) {

      px(
        x,
        Math.min(
          y,
          previousY
        ),
        color
      );

    }


    previousY =
      y;

  }
}


/* =====================================================
   SPARKLES
===================================================== */

const sparkleData = [

  [18,148,0.2],
  [47,165,1.1],
  [75,153,2.7],
  [102,174,4.3],
  [130,145,5.2],
  [149,162,6.7],
  [177,151,8.0],
  [197,171,9.4],
  [219,145,10.6],
  [238,159,11.9],
  [261,174,13.0],
  [281,150,14.7],
  [302,166,16.2]

];


function drawSparkles(
  state
) {

  sparkleData.forEach(
    (
      [
        baseX,
        baseY,
        phase
      ],
      index
    ) => {

      const light =
        0.5 +
        0.5 *
        Math.sin(
          state.time *
          0.00105 +
          phase
        );


      /*
        只有很亮的时候才出现
      */

      if (
        light >
        0.95
      ) {

        const dx =
          Math.round(
            Math.sin(
              state.time *
              0.00031 +
              phase
            )
            *
            2 /
            PX
          )
          *
          PX;


        const color =
          light > 0.982
          ?
          C.sparkle1
          :
          C.sparkle0;


        px(
          baseX + dx,
          baseY,
          color
        );


        if (
          index % 6 === 0 &&
          light > 0.987
        ) {

          px(
            baseX + dx + 2,
            baseY,
            color
          );

        }

      }

    }
  );
}


/* =====================================================
   RIVER
===================================================== */

function drawRiver(
  state
) {

  fullWave(
    144,
    1.1,
    40,
    state.flow * 18,
    C.wave0
  );


  fullWave(
    154,
    1.2,
    54,
    state.flow * 16 + 18,
    C.wave1
  );


  fullWave(
    165,
    1.4,
    66,
    state.flow * 20 + 36,
    C.wave1
  );


  fullWave(
    176,
    1.2,
    76,
    state.flow * 15 + 12,
    C.wave2
  );


  /*
    月光倒影位置仍然对应月亮 x
  */

  const shimmer =
    Math.round(
      Math.sin(
        state.time *
        0.0009
      )
      *
      2 /
      PX
    )
    *
    PX;


  rect2(
    moonX - 7 + shimmer,
    140,
    14,
    2,
    C.reflection2
  );


  rect2(
    moonX - 4 - shimmer,
    149,
    8,
    2,
    C.reflection0
  );


  rect2(
    moonX - 9 + shimmer,
    159,
    18,
    2,
    C.reflection1
  );


  rect2(
    moonX - 5,
    169,
    10,
    2,
    C.reflection0
  );


  rect2(
    moonX - 7 - shimmer,
    177,
    14,
    2,
    C.reflection1
  );


  drawSparkles(
    state
  );
}

   CREATE INDEPENDENT PHYSICS STATE
===================================================== */

const willowPhysics =
  willowConfigs.map(
    config => ({

      config,

      /*
        4 段独立角度
      */

      angle: [
        0,
        0,
        0,
        0
      ],

      /*
        4 段独立速度
      */

      velocity: [
        0,
        0,
        0,
        0
      ]

    })
  );


/* =====================================================
   GLOBAL WIND

   风速一直变化
   方向永远左 → 右
===================================================== */

function globalWind(
  time
) {

  /*
    很慢的大尺度风速变化
  */

  const slow =
    Math.sin(
      time *
      0.00012
    )
    *
    0.018;


  /*
    中尺度变化
  */

  const medium =
    Math.sin(
      time *
      0.00029 +
      1.8
    )
    *
    0.011;


  /*
    很轻的小阵风
  */

  const fast =
    Math.sin(
      time *
      0.00071 +
      0.4
    )
    *
    0.005;


  /*
    始终 > 0
    所以风永远向右
  */

  return Math.max(
    0.028,

    0.062 +
    slow +
    medium +
    fast

  );
}


/* =====================================================
   UPDATE EACH WILLOW SEPARATELY
===================================================== */

function updateWillows(
  state,
  dt
) {

  const baseWind =
    globalWind(
      state.time
    );


  willowPhysics.forEach(
    (
      branch,
      branchIndex
    ) => {

      const c =
        branch.config;


      /*
        每根柳枝自己的局部风
      */

      const localGust =
        Math.sin(
          state.time *
          c.gustFreq +
          c.phase
        )
        *
        c.gustAmp;


      /*
        仍然确保不反向
      */

      const localWind =
        Math.max(
          0.015,
          baseWind *
          c.windGain +
          localGust
        );


      /*
        四段对风的反应完全不同
      */

      const windResponse = [
        0.42,
        0.68,
        0.96,
        1.28
      ];


      /*
        4 段基础弹性
      */

      const springBase = [
        13.0,
        10.5,
        8.4,
        6.7
      ];


      /*
        4 段基础阻尼
      */

      const dampingBase = [
        9.1,
        8.0,
        7.0,
        6.1
      ];


      for (
        let section = 0;
        section < 4;
        section++
      ) {

        /*
          每段还有自己的微小摆动
        */

        const microMotion =
          Math.sin(

            state.time *
            (
              c.gustFreq *
              (
                1.2 +
                section *
                0.22
              )
            )
            +

            c.phase +

            section *
            0.73

          )
          *
          (
            0.004 +
            section *
            0.003
          );


        /*
          目标角度
          越往下越容易向右
        */

        const target =
          0.012 +
          localWind *
          windResponse[
            section
          ]
          +
          microMotion;


        /*
          每根柳枝拥有自己的弹性
        */

        const spring =
          springBase[
            section
          ]
          *
          c.stiffness;


        /*
          每根柳枝拥有自己的阻尼
        */

        const damping =
          dampingBase[
            section
          ]
          *
          c.damping;


        const difference =
          target -
          branch.angle[
            section
          ];


        const acceleration =
          difference *
          spring;


        branch.velocity[
          section
        ] +=
          acceleration *
          dt;


        /*
          阻尼
        */

        branch.velocity[
          section
        ] *=
          Math.exp(
            -damping *
            dt
          );


        branch.angle[
          section
        ] +=
          branch.velocity[
            section
          ] *
          dt;

      }

    }
  );
}


/* =====================================================
   STEM
===================================================== */

function stemLine(
  x0,
  y0,
  x1,
  y1,
  color
) {

  const dx =
    x1 - x0;

  const dy =
    y1 - y0;


  const distance =
    Math.max(
      Math.abs(dx),
      Math.abs(dy)
    );


  const steps =
    Math.max(
      1,
      Math.ceil(
        distance /
        PX
      )
    );


  for (
    let i = 0;
    i <= steps;
    i++
  ) {

    const t =
      i / steps;


    px(

      x0 +
      dx *
      t,

      y0 +
      dy *
      t,

      color

    );

  }
}


/* =====================================================
   LEAF SEED
===================================================== */

function leafSeed(
  branch,
  section,
  index
) {

  return (
    branch *
    53 +
    section *
    31 +
    index *
    29
  )
  %
  100;
}


/* =====================================================
   DRAW WILLOW
===================================================== */

function drawOneWillow(
  branch,
  branchIndex
) {

  const c =
    branch.config;


  /*
    四段长度
  */

  const proportions = [
    0.22,
    0.24,
    0.25,
    0.29
  ];


  let rootX =
    c.root;

  let rootY =
    -4;


  for (
    let section = 0;
    section < 4;
    section++
  ) {

    const length =
      c.length *
      proportions[
        section
      ];


    /*
      每一段使用自己的物理角度
    */

    const angle =
      branch.angle[
        section
      ];


    const endX =
      rootX +
      Math.sin(
        angle
      )
      *
      length;


    const endY =
      rootY +
      Math.cos(
        angle
      )
      *
      length;


    /*
      每段内部继续画成柔和曲线
      但不会像面条
    */

    const detail =
      Math.max(
        3,
        Math.round(
          length /
          8
        )
      );


    let previousX =
      rootX;

    let previousY =
      rootY;


    for (
      let i = 1;
      i <= detail;
      i++
    ) {

      const t =
        i /
        detail;


      /*
        非常轻微的局部弧线
      */

      const curve =
        Math.sin(
          t *
          Math.PI
        )
        *
        angle *
        length *
        0.055;


      const x =
        rootX +
        (
          endX -
          rootX
        )
        *
        t +
        curve;


      const y =
        rootY +
        (
          endY -
          rootY
        )
        *
        t;


      const gridX =
        Math.round(
          x /
          PX
        )
        *
        PX;


      const gridY =
        Math.round(
          y /
          PX
        )
        *
        PX;


      stemLine(
        previousX,
        previousY,
        gridX,
        gridY,
        C.willow
      );


      /*
        每根柳枝自己的叶片密度
      */

      const seed =
        leafSeed(
          branchIndex,
          section,
          i
        );


      if (
        seed <
        c.density *
        100
      ) {

        if (
          seed %
          3 ===
          0
        ) {

          px(
            gridX + 2,
            gridY,
            C.willowLight
          );


          px(
            gridX + 4,
            gridY,
            C.willowLight
          );

        }


        else if (
          seed %
          3 ===
          1
        ) {

          px(
            gridX - 2,
            gridY + 2,
            C.willowDark
          );


          px(
            gridX - 4,
            gridY + 2,
            C.willowDark
          );

        }


        else {

          px(
            gridX + 2,
            gridY + 2,
            C.willowLight
          );

        }

      }


      previousX =
        gridX;

      previousY =
        gridY;

    }


    /*
      下一段接上一段末端
    */

    rootX =
      endX;

    rootY =
      endY;

  }
}


function drawWillows() {

  willowPhysics.forEach(
    (
      branch,
      index
    ) => {

      drawOneWillow(
        branch,
        index
      );

    }
  );
}


/* =====================================================

  ],

  ],

  ]

const CN = {

  "山": [
    "001000100",

    "101000101",

  ],

    "100010001",
    "111111111",
    "100010001",
    "100010001",
    "100010001",
    "111111111"
  ]

};


function drawMatrix(
  matrix,
  x,
  y
) {

  matrix.forEach(
    (
      row,
      rowIndex
    ) => {

      [...row].forEach(
        (
          value,
          columnIndex
        ) => {

          if (
            value === "1"
          ) {

            px(

              x +
              columnIndex *
              PX,

              y +
              rowIndex *
              PX,

              C.white

            );

          }

        }
      );

    }
  );
}


/* =====================================================
   TITLE
===================================================== */

function drawTitle() {

  const english =
    [
      "h",
      "i",
      " ",
      "i",
      "'",
      "m"
    ];


  const widths = {

    h: 5,
    i: 5,
    "'": 5,
    m: 5,
    " ": 3

  };


  const letterGap =
    4;


  let englishWidth =
    0;


  english.forEach(
    char => {

      englishWidth +=
        widths[
          char
        ] *
        PX +
        letterGap;

    }
  );


  const chineseGap =
    6;


  const chineseWidth =
    3 *
    (
      9 *
      PX
    )
    +
    2 *
    chineseGap;


  const totalWidth =
    englishWidth +
    10 +
    chineseWidth;


  let x =
    Math.round(
      (
        (
          W -
          totalWidth
        )
        /
        2
      )
      /
      PX
    )
    *
    PX;


  const y =
    88;


  english.forEach(
    char => {

      if (
        char !==
        " "
      ) {

        drawMatrix(
          EN[
            char
          ],
          x,
          y + 2
        );

      }


      x +=
        widths[
          char
        ] *
        PX +
        letterGap;

    }
  );


  x +=
    6;


  [
    "山",
    "山",
    "田"
  ].forEach(
    (
      char,
      index
    ) => {

      drawMatrix(
        CN[
          char
        ],
        x,
        y
      );


      x +=
        9 *
        PX;


      if (
        index <
        2
      ) {

        x +=
          chineseGap;

      }

    }
  );
}


/* =====================================================
   STATE
===================================================== */

const state = {

  time:
    0,

  flow:
    0,

  cloudShift:
    0,

  last:
    0

};


/* =====================================================
   MAIN LOOP
===================================================== */

function render(
  stamp
) {

  if (
    !state.last
  ) {

    state.last =
      stamp;

  }


  let dt =
    (
      stamp -
      state.last
    )
    /
    1000;


  /*
    防止后台回来发生跳跃
  */

  dt =
    Math.min(
      dt,
      0.033
    );


  state.last =
    stamp;

  state.time =
    stamp;


  /*
    江水仍然非常慢
  */

  state.flow +=
    dt *
    1.05;


  /*
    云更慢
  */

  state.cloudShift +=
    dt *
    0.65;


  /*
    每一根柳枝，
    每一段，
    单独计算一次物理
  */

  updateWillows(
    state,
    dt
  );


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawSky();

  drawClouds(
    state
  );

  drawMoon();

  drawHorizon();

  drawWaterBase();

  drawRiver(
    state
  );

  drawWillows();

  drawTitle();


  requestAnimationFrame(
    render
  );
}


requestAnimationFrame(
  render
);

</script>
