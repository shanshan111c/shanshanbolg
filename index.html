/* =====================================================
   SETUP

   所有绘制的基础像素全部为 2 × 2
===================================================== */

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 180;

const PX = 2;


/* =====================================================
   SCALE
===================================================== */

function fitCanvas() {

  const scale = Math.max(
    window.innerWidth / W,
    window.innerHeight / H
  );

  canvas.style.width =
    Math.ceil(W * scale) + "px";

  canvas.style.height =
    Math.ceil(H * scale) + "px";
}

window.addEventListener("resize", fitCanvas);

fitCanvas();


/* =====================================================
   COLORS
===================================================== */

const C = {

  /* SKY */

  sky0: [1, 4, 11],
  sky1: [2, 8, 21],
  sky2: [3, 15, 38],
  sky3: [4, 25, 60],
  sky4: [6, 37, 82],
  sky5: [8, 49, 103],
  sky6: [10, 61, 120],

  /* CLOUD */

  cloud0: "#061936",
  cloud1: "#08244b",
  cloud2: "#0b315f",

  /* WATER */

  water0: [5, 22, 32],
  water1: [6, 30, 42],
  water2: [8, 39, 52],
  water3: [10, 48, 62],

  wave0: "#0e3545",
  wave1: "#124152",
  wave2: "#174b5b",

  /* WILLOW */

  willowDark: "#07342d",

  /* MOON */

  moonEdge: "#d4c18b",
  moonMid: "#efdda4",
  moon: "#fff0bd",

  shine1: "#f3e1aa",

  white: "#ffffff"

/* =====================================================
   BASIC 2×2 PIXEL
===================================================== */

function px(x, y, color) {

  ctx.fillStyle = color;

  ctx.fillRect(
    Math.round(x / PX) * PX,
    Math.round(y / PX) * PX,
    PX,
    PX
  );
}


/*
  用 2×2 像素组合更大的色块
*/

function rect2(x, y, w, h, color) {

  for (let yy = y; yy < y + h; yy += PX) {

    for (let xx = x; xx < x + w; xx += PX) {

      px(xx, yy, color);

    }

  }
}


/* =====================================================
   RGB
===================================================== */

function mix(a, b, t) {

  const r = Math.round(
    a[0] + (b[0] - a[0]) * t
  );

  const g = Math.round(
    a[1] + (b[1] - a[1]) * t
  );

  const blue = Math.round(
    a[2] + (b[2] - a[2]) * t
  );

  return `rgb(${r},${g},${blue})`;
}


/* =====================================================
   SKY

   不放随机噪点。
   整片天空由同样大小的 2×2 色块组成。
===================================================== */

const horizon = 136;


function skyColor(y) {

  const t = y / horizon;

  if (t < 0.18) {

    return mix(
      C.sky0,
      C.sky1,
      t / 0.18
    );

  }

  if (t < 0.38) {

    return mix(
      C.sky1,
      C.sky2,
      (t - 0.18) / 0.20
    );

  }

  if (t < 0.60) {

    return mix(
      C.sky2,
      C.sky3,
      (t - 0.38) / 0.22
    );

  }

  if (t < 0.80) {

    return mix(
      C.sky3,
      C.sky4,
      (t - 0.60) / 0.20
    );

  }

  if (t < 0.93) {

    return mix(
      C.sky4,
      C.sky5,
      (t - 0.80) / 0.13
    );

  }

  return mix(
    C.sky5,
    C.sky6,
    (t - 0.93) / 0.07
  );
}


function drawSky() {

  for (let y = 0; y < horizon; y += PX) {

    const color = skyColor(y);

    for (let x = 0; x < W; x += PX) {

      px(
        x,
        y,
        color
      );

    }

  }
}

function drawCloudMass(baseX, baseY, pieces) {

  pieces.forEach(
    ([x, y, w, h, color]) => {

      rect2(
        baseX + x,
        baseY + y,
        w,
        h,
        color
      );

    }
  );
}


function drawClouds(time) {

  clouds.forEach(cloud => {

    /*
      所有云的位置也锁定到 2×2 网格
    */

    const movement =
      Math.floor(
        time * cloud.speed / PX
      ) * PX;


    const wrap =
      W + 220;


    let x =
      cloud.x +
      movement;


    while (x > W + 100) {
      x -= wrap;
    }


    drawCloudMass(
      x,
      cloud.y,
      cloud.pieces
    );


    drawCloudMass(
      x - wrap,
      cloud.y,
      cloud.pieces
    );

  });
}


/* =====================================================

===================================================== */

const moonY = 111;

    最外围只有一圈 2×2 光晕
  */

  for (let x = -18; x <= 18; x += PX) {

      C.halo
    );

    px(
      moonX + x,
      moonY + 18,
      C.halo
    );
  }


  for (let y = -16; y <= 16; y += PX) {

    px(
      moonX - 18,
      moonY + y,
      C.halo
    );

    px(
      moonX + 18,
      moonY + y,
      C.halo
    );
  }


  /*
    方形月亮
  */

  rect2(
    moonX - 14,
    moonY - 14,
    28,
    28,
    C.moonEdge
  );


  rect2(
    moonX - 12,
    moonY - 12,
    24,
    24,
    C.moonMid
  );


  rect2(
    moonX - 10,
    moonY - 10,
    20,
    20,
    C.moon
  );


  rect2(
    moonX - 8,
    moonY - 8,
    16,
    16,
    C.moonCore
  );


  /*
    极少量月面色块
  */

  rect2(
    moonX - 8,
    moonY - 2,
    4,
    4,
    "#e5d19d"
  );


  rect2(
    moonX + 4,
    moonY + 4,
    4,
    2,
    "#dfcb94"
  );
}


/* =====================================================
   HORIZON

   没有山，没有树线，没有丘陵。
===================================================== */

function drawHorizon() {

  rect2(
    0,
    horizon,
    W,
    2,
    "#071923"
  );
}


/* =====================================================
   WATER BACKGROUND

   同样完全由 2×2 色块组成
===================================================== */

function waterColor(y) {

  const t =
    (y - horizon) /
    (H - horizon);


  if (t < 0.35) {

    return mix(
      C.water0,
      C.water1,
      t / 0.35
    );

  }


  if (t < 0.70) {

    return mix(
      C.water1,
      C.water2,
      (t - 0.35) / 0.35
    );

  }


  return mix(
    C.water2,
    C.water3,
    (t - 0.70) / 0.30
  );
}


function drawWaterBase() {

  for (
    let y = horizon + 2;
    y < H;
    y += PX
  ) {

    const color =
      waterColor(y);


    for (
      let x = 0;
      x < W;
      x += PX
    ) {

      px(
        x,
        y,
        color
      );

    }

  }
}


/* =====================================================
   WHOLE WATER WAVE

   每一条都是从左到右完整的波。
   起伏只有 2px 左右。
===================================================== */

function fullWave(
  baseY,
  amplitude,
  wavelength,
  shift,
  color
) {

  let lastY =
    baseY;


  for (
    let x = 0;
    x < W;
    x += PX
  ) {

    const rawY =
      baseY +
      Math.sin(
        (x - shift) /
        wavelength
      ) *
      amplitude;


    const y =
      Math.round(
        rawY / PX
      ) * PX;


    px(
      x,
      y,
      color
    );


    /*
      如果相邻波点上下移动 2px，
      补一个像素，保持整条连续
    */

    if (y !== lastY) {

      px(
        x,
        Math.min(
          y,
          lastY
        ),
        color
      );

    }


    lastY =
      y;

  }

}


/* =====================================================
   RIVER

   只保留少量整波。
   非常慢向右移动。
===================================================== */

function drawRiver(time) {

  const flow =
    time * 0.00045;


  fullWave(
    144,
    1.2,
    40,
    flow,
    C.wave0
  );


  fullWave(
    154,
    1.3,
    52,
    flow * 0.92 + 18,
    C.wave1
  );


  fullWave(
    165,
    1.6,
    64,
    flow * 1.04 + 36,
    C.wave1
  );


  fullWave(
    176,
    1.4,
    74,
    flow * 0.86 + 12,
    C.wave2
  );


  /*
    月光倒影
  */

  const shimmer =
    Math.round(
      Math.sin(
        time * 0.00065
      ) * 2 / PX
    ) * PX;


  rect2(
    moonX - 8 + shimmer,
    140,
    16,
    2,
    C.shine1
  );


  rect2(
    moonX - 4 - shimmer,
    148,
    8,
    2,
    C.shine0
  );


  rect2(
    moonX - 10 + shimmer,
    158,
    20,
    2,
    C.shine1
  );


  rect2(
    moonX - 6,
    168,
    12,
    2,
    C.shine0
  );


  rect2(
    moonX - 8 - shimmer,
    178,
    16,
    2,
    C.shine1
  );
}

/* =====================================================
   2×2 STEM LINE

   柳枝本身永远只有 1 个基础像素粗：
   2×2
===================================================== */

function stemLine(
  x0,
  y0,
  x1,
  y1,
  color
) {

  const dx =
    x1 - x0;

  const dy =
    y1 - y0;


  const distance =
    Math.max(
      Math.abs(dx),
      Math.abs(dy)
    );


  const steps =
    Math.max(
      1,
      Math.ceil(
        distance / PX
      )
    );


  for (
    let i = 0;
    i <= steps;
    i++
  ) {

    const t =
      i / steps;


    px(
      x0 + dx * t,
      y0 + dy * t,
      color
    );

  }

}


/* =====================================================
   DRAW WILLOW

   不做面条一样的物理。
   上半段稳定，
   下半段柔一点点。
===================================================== */

function drawOneWillow(
  willow,
  index,
  time
) {

  /*
    整体微微向右
  */

  const wind =
    3.5;


  /*
    上半段摆动非常小
  */

  const upperSway =
    Math.sin(
      time * 0.00025 +
      willow.phase
    ) *
    0.7;


  /*
    下半段比上半段柔，
    但幅度仍然很小
  */

  const lowerSway =
    Math.sin(
      time * 0.00036 +
      willow.phase * 1.4
    ) *
    1.4;


  const segments =
    Math.max(
      8,
      Math.round(
        willow.length / 7
      )
    );


  let previousX =
    willow.root;


  let previousY =
    -4;


  for (
    let i = 1;
    i <= segments;
    i++
  ) {

    const p =
      i / segments;


    /*
      主体是缓慢向右的弧线
  */

    let x =
      willow.root +
      willow.bend *
      p *
      p;


    x +=
      wind * p;


    if (p < 0.52) {

      x +=
        upperSway * p;

    }

    else {

      const lp =
        (p - 0.52) /
        0.48;


      x +=
        upperSway * 0.52 +
        lowerSway * lp;

    }


    const y =
      -4 +
      willow.length * p;


    /*
      锁定到 2×2 网格
    */

    const gridX =
      Math.round(x / PX) * PX;


    const gridY =
      Math.round(y / PX) * PX;


    stemLine(
      previousX,
      previousY,
      gridX,
      gridY,
      C.willow
    );


    /*
      每根柳枝有自己的叶片密度
  */

    const seed =
      (
        index * 41 +
        i * 29
      ) %
      100;


    if (
      seed <
      willow.density * 100
    ) {

      /*
        叶子也完全由 2×2 像素组成
      */

      if (i % 3 === 0) {

        px(
          gridX + 2,
          gridY,
          C.willowLight
        );

        px(
          gridX + 4,
          gridY,
          C.willowLight
        );

      }

      else if (i % 3 === 1) {

        px(
          gridX - 2,
          gridY + 2,
          C.willowDark
        );

        px(
          gridX - 4,
          gridY + 2,
          C.willowDark
        );

      }

      else {

        px(
          gridX + 2,
          gridY + 2,
          C.willowLight
        );

      }

    }


    previousX =
      gridX;


    previousY =
      gridY;

  }

}


function drawWillows(time) {

  willows.forEach(
    (
      willow,
      index
    ) => {

      drawOneWillow(
        willow,
        index,
        time
      );

    }
  );
}

function drawMatrix(

    (
      row,
      rowIndex
    ) => {

      [...row].forEach(
        (
          value,
          columnIndex
        ) => {

          if (value === "1") {

            px(
              x + columnIndex * PX,
              y + rowIndex * PX,
              C.white
            );

          }

        }
      );

    }
  );
}


/* =====================================================
   TITLE
===================================================== */

function drawTitle() {

  const english =
    ["h", "i", " ", "i", "'", "m"];


  const widths = {

    h: 5,
    i: 5,
    "'": 5,
    m: 5,
    " ": 3

  };


  const letterGap =
    4;


  let englishWidth =
    0;


  english.forEach(
    char => {

      englishWidth +=
        widths[char] * PX +
        letterGap;

    }
  );


  const chineseGap =
    6;


  const chineseWidth =
    3 * (9 * PX) +
    2 * chineseGap;


  const totalWidth =
    englishWidth +
    10 +
    chineseWidth;


  let x =
    Math.round(
      (
        W -
        totalWidth
      ) /
      2 /
      PX
    ) * PX;


  const y =
    88;


  english.forEach(
    char => {

      if (char !== " ") {

        drawMatrix(
          EN[char],
          x,
          y + 2
        );

      }


      x +=
        widths[char] * PX +
        letterGap;

    }
  );


  x += 6;


  ["山", "山", "田"].forEach(
    (
      char,
      index
    ) => {

      drawMatrix(
        CN[char],
        x,
        y
      );


      x +=
        9 * PX;


      if (index < 2) {

        x +=
          chineseGap;

      }

    }
  );
}


/* =====================================================
   RENDER
===================================================== */

function render(time) {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawSky();

  drawClouds(time);

  drawMoon();

  drawHorizon();

  drawWaterBase();

  drawRiver(time);

  drawWillows(time);

  /*
    白字永远最后绘制
  */

  drawTitle();


  requestAnimationFrame(
    render
  );
}


requestAnimationFrame(render);

</script>
